<style>
/* Layout: 장난감 디오라마 방(왼쪽) + 손편지 같은 조작 패널(오른쪽), 모바일은 위아래로 쌓임 */
:root{
  color-scheme: light;
  --paper:#EEE7DA;      /* 페이지 바탕 */
  --cream:#FBF7EF;      /* 카드/패널 */
  --ink:#3A2A22;        /* 본문 */
  --ink-soft:#7A6656;
  --line:#E2D6C2;
  --red:#C23A2E;
  --green:#2E6E46;
  --green-deep:#1F5134;
  --gold:#D9A934;
  --font-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

.app{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--red);display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:1.55rem;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:0;font-size:.82rem;color:var(--ink-soft)}
.dday{font-family:var(--font-display);background:var(--green);color:#FFF8EA;padding:6px 14px;border-radius:999px;font-size:1rem;font-variant-numeric:tabular-nums}
.dday.xmas{background:var(--red)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:24px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}

/* ── Diorama ── */
.frame{background:#FFFFFF;border-radius:44px;padding:clamp(10px,2.2vw,18px);box-shadow:0 18px 40px -18px rgba(80,50,20,.35)}
.room{position:relative;aspect-ratio:5/4;border-radius:30px;overflow:hidden;background:#5a1e16;max-width:100%}
.room svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.room-hint{position:absolute;left:50%;top:10px;z-index:3000;transform:translateX(-50%);background:rgba(40,25,15,.62);color:#FFF6E6;font-size:.78rem;padding:4px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}
.snow{animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(130px)}}
.twinkle{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}

/* ── Gift box ── */
.scene-host,.scene-host svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.snow{animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(140px)}}
.twinkle{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.3}to{opacity:1}}
.flame{transform-origin:198px 248px;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(1.06,.9)}}
.fireglow{animation:tw 1.2s ease-in-out infinite alternate}
.spr{display:block;width:100%;height:100%;background-size:100% 100%;background-repeat:no-repeat}
.gift{position:absolute;width:11%;aspect-ratio:1;isolation:isolate;cursor:pointer;transform:translate(-50%,-97%);background:none;border:0;padding:0;transition:left .9s cubic-bezier(.3,.7,.3,1),top .9s cubic-bezier(.3,.7,.3,1),transform .2s}
.gift:hover{transform:translate(-50%,-102%)}
.gift::after{content:"";position:absolute;left:10%;right:10%;bottom:1%;height:12%;border-radius:50%;background:rgba(45,18,6,.42);filter:blur(3px);z-index:-1}
.gift.static::after,.wrap-opt .gift::after{display:none}
.gift.enter{animation:giftIn .7s cubic-bezier(.34,1.56,.64,1) calc(var(--i,0) * 80ms + .25s) both}
@keyframes giftIn{0%{translate:0 -70%;scale:.55;opacity:0}60%{opacity:1}100%{translate:0 0;scale:1;opacity:1}}
@media (prefers-reduced-motion: reduce){.gift.enter{animation:none}}
.gift .tag{position:absolute;left:50%;top:6%;transform:translateX(-50%);z-index:4;background:#FFF8EA;color:var(--green-deep);font-size:.62rem;font-family:var(--font-display);padding:1px 6px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.3);white-space:nowrap}
.gift.shake{animation:shake .55s}
@keyframes shake{0%,100%{rotate:0}20%{rotate:-9deg}40%{rotate:8deg}60%{rotate:-6deg}80%{rotate:4deg}}
.gift.new{animation:pop .5s .9s both}
@keyframes pop{0%{scale:1}50%{scale:1.18}100%{scale:1}}
.gift.static{position:relative;transform:none;left:auto;top:auto;display:inline-block}
.gift.static:hover{transform:none}

/* ── Panel ── */
.panel{background:var(--cream);border-radius:24px;padding:18px;box-shadow:0 10px 30px -18px rgba(80,50,20,.35);display:grid;gap:16px;min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#EFE5D3;border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:9px 6px;border-radius:10px;font-family:var(--font-display);font-size:.98rem;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{background:var(--cream);color:var(--ink);box-shadow:0 2px 6px rgba(80,50,20,.15)}
h2{font-family:var(--font-display);font-weight:400;font-size:1.35rem;margin:0;line-height:1.25;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--ink-soft);font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#FFFFFF;border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.75rem;color:var(--ink-soft)}
.box{border:1px dashed #CDBB9E;border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.label{font-size:.78rem;color:var(--ink-soft);letter-spacing:.02em}
.link-row{display:flex;gap:8px;align-items:center}
.link-row code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:.85rem;user-select:all}
.btn{border:0;border-radius:12px;padding:10px 16px;font-family:var(--font-display);font-size:1rem;background:var(--green);color:#FFF8EA;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.btn:hover{background:var(--green-deep)}
.btn.red{background:var(--red)}
.btn.red:hover{background:#A42E24}
.btn.ghost{background:#FFFFFF;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.wide{width:100%;padding:13px}
.btn:disabled{opacity:.45;cursor:default}
.count{background:linear-gradient(160deg,#2E6E46,#1F5134);color:#FFF8EA;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.count.xmas{background:linear-gradient(160deg,#C23A2E,#962a21)}
.count strong{font-family:var(--font-display);font-weight:400;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.count p{margin:0;font-size:.85rem;opacity:.92}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.88rem;color:var(--ink-soft)}
.switch input{appearance:none;width:44px;height:26px;border-radius:99px;background:#D8CBB5;position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;transition:left .2s}
.switch input:checked{background:var(--red)}
.switch input:checked::after{left:21px}

/* sender form */
.step{display:grid;gap:8px}
.step-h{display:flex;align-items:baseline;gap:8px;font-family:var(--font-display);font-size:1.02rem}
.step-h i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--cream);display:inline-grid;place-items:center;font-size:.78rem;flex:none}
.step-h small{font-family:var(--font-body);font-size:.78rem;color:var(--ink-soft)}
.wraps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wrap-opt{border:2px solid transparent;background:#FFFFFF;border-radius:12px;padding:8px 4px 4px;display:grid;justify-items:center;gap:2px;font-size:.68rem;color:var(--ink-soft)}
.wrap-opt[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.wrap-opt .gift{width:70%}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.item-opt{border:2px solid var(--line);background:#FFFFFF;border-radius:12px;padding:8px 6px;font-size:.82rem;line-height:1.3}
.item-opt[aria-pressed="true"]{border-color:var(--ink);background:#FFF6E3}
.item-opt b{display:block;font-size:1.25rem;font-weight:400}
textarea,input[type="text"]{width:100%;font:inherit;color:var(--ink);background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
textarea{resize:vertical;min-height:84px}
textarea:focus,input[type="text"]:focus{outline:2px solid var(--gold);border-color:transparent}
.hint-in{display:grid;gap:6px}
.err{color:var(--red);font-size:.82rem;margin:0}
.meta{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-soft)}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(35,22,14,.6);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet{background:var(--cream);border-radius:26px;width:min(460px,100%);padding:22px 20px;display:grid;gap:16px;position:relative;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:1.5rem;line-height:1;color:var(--ink-soft);padding:6px}
.stage-gift{display:grid;place-items:center;padding:18px 0 4px}
.stage-gift .gift{width:150px}
.stage-gift .gift.unwrap{animation:unwrap .75s ease-in forwards}
@keyframes unwrap{0%{transform:none}25%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.08)}100%{transform:scale(1.5);opacity:0}}
.letter{background:#FFFFFF;border-radius:6px;padding:18px 18px 16px;box-shadow:0 6px 18px -8px rgba(80,50,20,.4);border-top:6px solid var(--red);background-image:repeating-linear-gradient(transparent 0 27px,#F1E8DA 27px 28px);animation:rise .5s ease-out}
.letter .item{display:inline-block;background:#FFF2D9;border-radius:99px;padding:2px 10px;font-size:.8rem;margin-bottom:8px}
.letter p{margin:0 0 10px;white-space:pre-wrap;line-height:28px}
.from{text-align:right;font-family:var(--font-display);font-size:1.1rem}
.from .q{display:inline-block;background:var(--ink);color:var(--cream);border-radius:6px;padding:0 10px;letter-spacing:.2em}
.stamp{display:inline-block;transform:rotate(-8deg);border:2px solid var(--red);color:var(--red);border-radius:8px;padding:0 8px;margin-right:8px;font-size:.9rem;animation:stampIn .35s ease-out}
.stamp.miss{border-color:var(--ink-soft);color:var(--ink-soft)}
@keyframes stampIn{from{transform:rotate(-8deg) scale(1.8);opacity:0}}
.hints{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hints li{display:flex;gap:8px;align-items:center;background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:.9rem}
.hints li.locked{color:var(--ink-soft);background:#F4ECDD;border-style:dashed}
.hints li em{font-style:normal;font-family:var(--font-display);font-size:.8rem;color:var(--gold);flex:none}
.cands{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cand{border:2px solid var(--line);background:#FFFFFF;border-radius:12px;padding:10px;font-family:var(--font-display);font-size:1.05rem}
.cand:hover:not(:disabled){border-color:var(--ink)}
.cand.wrong{text-decoration:line-through;color:var(--ink-soft);background:#F4ECDD;cursor:default}
.cand.right{border-color:var(--green);background:#E5F1E8;color:var(--green-deep)}
.guess-h{display:flex;justify-content:space-between;align-items:baseline}
.lives{font-size:.85rem;color:var(--red);letter-spacing:.1em}
.result{background:#FFF2D9;border-radius:14px;padding:12px 14px;font-size:.92rem}
.result b{font-family:var(--font-display);font-weight:400;font-size:1.1rem}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#FFF8EA;padding:10px 16px;border-radius:14px;font-size:.9rem;opacity:0;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>
.panel{display:block}
.panel div{min-width:0}
[hidden]{display:none!important}
body{margin:0;word-break:keep-all;overflow-wrap:break-word}

.linkish{background:none;border:0;padding:0;color:var(--ink-soft);text-decoration:underline;font-size:.85rem;cursor:pointer}
.decoys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.for-real{display:grid;gap:8px}

.radio b{display:block;color:var(--ink);font-size:.95rem}
.for-real .note{margin:0;font-size:.85rem;color:var(--red)}
.real-row{display:flex;gap:14px;align-items:center}
.real-icon{font-size:2.6rem;line-height:1}
.real-row b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.25rem}
.real-row p{margin:2px 0 0;color:var(--ink-soft)}
.chip.more{background:none;border-style:dashed;color:var(--ink-soft)}
.auto-hint{border:1px dashed var(--line);border-radius:12px;padding:9px 12px;font-size:.9rem;color:var(--ink-soft);background:#F7F0E3}
.check{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--ink-soft);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--green)}
.left-col{display:grid;gap:16px;position:sticky;top:16px;min-width:0}
@media (max-width:860px){.left-col{position:static}}
.side-card{background:var(--cream);border-radius:24px;padding:18px 20px;box-shadow:0 10px 30px -18px rgba(80,50,20,.35);display:grid;gap:12px}
.side-card h3{font-family:var(--font-display);font-weight:400;font-size:1.15rem;margin:0}
.preview{display:flex;align-items:center;gap:18px}
.preview .gift{width:96px;flex:none}
.preview p{margin:0;color:var(--ink-soft);font-size:.9rem}
.preview b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.1rem;color:var(--ink)}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;counter-reset:f}
.flow li{counter-increment:f;background:#FFFFFF;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.85rem;color:var(--ink-soft);line-height:1.45}
.flow li::before{content:counter(f);display:block;font-family:var(--font-display);font-size:1.3rem;color:var(--red);line-height:1.2}
.flow li b{display:block;color:var(--ink);font-weight:700}
.side-meta{display:flex;gap:8px;flex-wrap:wrap}
.side-meta span{font-size:.8rem;background:#EFE5D3;border-radius:999px;padding:3px 10px;color:var(--ink-soft)}
@media (max-width:860px){.side-card.desk-only{display:none}}

a.btn{display:block;text-align:center;text-decoration:none}

.btn{font-size:1.08rem;padding:13px 18px;border-radius:14px}
.btn.wide,.login{padding:15px 18px;font-size:1.08rem}
.step{gap:12px}
.step-h{font-size:1.15rem;gap:10px}
.step-h i{width:26px;height:26px;font-size:.85rem}
.step-h small{font-size:.85rem}
.wraps{gap:8px}
.wrap-opt{padding:10px 4px 6px;font-size:.78rem;gap:4px}
.items{gap:10px}
.item-opt{padding:12px 8px;font-size:.92rem;line-height:1.4}
.item-opt b{font-size:1.5rem;margin-bottom:2px}
.chips{gap:8px}
.chip{font-size:.9rem;padding:7px 14px}
.hint-in,.decoys{gap:10px}
textarea,input[type="text"]{font-size:16px;padding:13px 14px;border-radius:14px}
textarea{min-height:110px}
.auto-hint{font-size:.92rem;padding:12px 14px}
.check,.fine,.meta{font-size:.88rem}
.radio{font-size:.88rem;padding:12px 14px}
.radio b{font-size:1rem}
.box{padding:16px;gap:12px}
.link-row code{font-size:.95rem;padding:11px 12px}
@media (max-width:600px){
  body{padding-left:12px;padding-right:12px}
  .app{gap:16px}
  .frame{padding:7px;border-radius:26px}
  .room{border-radius:20px}
  .panel{padding:22px 18px;border-radius:22px}
  .items{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{font-size:1.6rem}
}

/* 휴대폰: 양옆을 조금씩 덜고 트리와 선물을 크게 */
.stage{position:absolute;inset:0}
@media (max-width:600px){
  .room{aspect-ratio:39/40}
  .stage{left:-14.1%;right:auto;width:128.2%}
}

.buy-link{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gold);color:#3A2414;text-decoration:none;font-family:"Jua",sans-serif;font-size:1.05rem;padding:13px 16px;border-radius:14px;box-shadow:0 3px 0 rgba(120,80,20,.35);transition:transform .15s}
.buy-link small{font-family:"Gowun Dodum",sans-serif;font-size:.85rem;opacity:.85;white-space:nowrap}
.buy-link span{white-space:nowrap}
@media (max-width:400px){.buy-link{font-size:.98rem;padding:12px 14px}.buy-link small{font-size:.78rem}}
.buy-link:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,80,20,.35)}
.real-card.for-real .buy-link{background:var(--red);color:#fff;box-shadow:0 3px 0 rgba(110,20,20,.4)}

.room img,.room .r3d{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.room .r3d img{pointer-events:none}
.room-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:10px}
.room-tools .room-card-btn:only-child{grid-column:1/-1}
.room-card-btn{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--cream);color:var(--ink);font-family:var(--font-display);font-size:1rem;cursor:pointer}
.room-card-btn:active{transform:translateY(1px)}
.gift-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:60vh;overflow-y:auto;overscroll-behavior:contain}
.gl-row{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer}
.gl-row:disabled{cursor:default;color:var(--ink)}
.gl-row .gift{width:52px;flex:none}
.gl-text{flex:1;min-width:0;display:grid;gap:3px}
.gl-head{display:flex;align-items:center;gap:6px}
.gl-head b{font-family:var(--font-display);font-weight:400;font-size:1rem}
.gl-tag{font-size:.72rem;padding:1px 8px;border-radius:999px;background:#EFE5D3;color:var(--ink-soft)}
.gl-tag.ok{background:var(--green);color:#FFF8EA}
.gl-tag.off{background:#E8E1D6;color:#9A8E80}
.gl-sub{margin:0;font-size:.85rem;color:var(--ink-soft)}
.gl-item{margin:0;font-size:.85rem;color:var(--ink-soft)}
.gl-msg{margin:0;font-size:.95rem;line-height:1.55;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gl-from{margin:0;font-size:.82rem;color:var(--ink-soft);text-align:right}
.gl-go{flex:none;align-self:center;font-size:.85rem;color:var(--red);white-space:nowrap}
.how{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;counter-reset:how}
.how li{counter-increment:how;position:relative;padding:10px 12px 10px 46px;background:#fff;border:1px solid var(--line);border-radius:14px;font-size:.9rem;line-height:1.5;color:var(--ink-soft)}
.how li::before{content:attr(data-i);position:absolute;left:13px;top:10px;font-size:1.25rem;line-height:1.3}
.how li b{display:block;color:var(--ink);font-family:var(--font-display);font-weight:400;font-size:1rem}
.how-note{margin-top:8px!important;font-size:.82rem}
.site-nav{flex-wrap:wrap}
.lang-btn{border:1px solid var(--line);background:var(--cream);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.82rem;cursor:pointer;order:2;margin-left:auto}
.site-nav a:last-of-type{order:3}
.step-h{flex-wrap:wrap}
html[lang=en] .step-h small{flex-basis:100%;padding-left:32px}
.card-shot{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 8px 24px -10px rgba(80,50,20,.45)}
a.btn{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
.prod{display:grid;gap:4px;min-width:0}
.prod .item-opt{width:100%}
.prod-link{font-size:.8rem;color:var(--ink-soft);text-align:center;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
</style>
