<html lang="ko">

<title>산타의 비밀 택배 도트 샘플 3 | 무드나잇</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
/* 샘플 3: 위에서 내려다본 눈 내린 마을 광장(192×144 도트), 나무 테두리 + 양피지 창 */
:root{
  color-scheme: dark;
  --sky:#1d2a4a; --sky-2:#243458;
  --wood:#b4622a; --wood-hi:#d98a45; --wood-dk:#6e3414; --edge:#3a1a08;
  --paper:#fbe4b4; --paper-2:#f2cf8d; --ink:#5a2a10; --ink-2:#8a5530;
  --red:#d83a2e; --green:#3d8b3a; --gold:#ffd04a;
  --font-pixel:"Galmuri11","Galmuri9",monospace; --font-title:"Galmuri14","Galmuri11",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sky);color:var(--paper)}
body{font-family:var(--font-pixel);font-size:14px;line-height:1.6;word-break:keep-all;
  background:radial-gradient(ellipse at 50% -10%,#33497c 0%,var(--sky) 60%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* 나무 테두리 창 */
.frame{background:var(--wood);padding:6px;box-shadow:0 0 0 3px var(--edge),inset 0 3px 0 var(--wood-hi),inset 0 -3px 0 var(--wood-dk),6px 8px 0 rgba(0,0,0,.35)}
.paper{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 3px var(--paper-2),inset 0 0 0 5px var(--wood-dk)}
.topbar{max-width:1180px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 14px;background:rgba(0,0,0,.25)}
.topbar a{color:var(--gold);text-decoration:none}
.topbar .note{color:#b9c4dc;font-size:12px}
.head{max-width:1180px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.title{margin:0;font-family:var(--font-title);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.1;color:#fff4d6;
  text-shadow:3px 0 0 var(--wood-dk),-3px 0 0 var(--wood-dk),0 3px 0 var(--wood-dk),0 -3px 0 var(--wood-dk),3px 3px 0 var(--wood-dk),-3px 3px 0 var(--wood-dk),3px -3px 0 var(--wood-dk),-3px -3px 0 var(--wood-dk),5px 6px 0 #0d1426}
.title span{color:#ff6a55}
.sub{margin:6px 0 0;color:#b9c4dc;font-size:13px}
.dday{font-size:16px;padding:8px 16px}
.main{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0}
.scene-wrap{position:relative;aspect-ratio:192/144;max-width:100%;overflow:hidden;background:#f2f6fc}
.scene-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#scene{image-rendering:pixelated}
#glow{mix-blend-mode:screen;pointer-events:none}
.hint{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(58,26,8,.85);color:#fff4d6;padding:3px 10px;font-size:12px;white-space:nowrap;pointer-events:none;z-index:5}
.gift{position:absolute;transform:translate(-50%,-100%);background:none;border:0;padding:0;width:8.34%;aspect-ratio:16/16;z-index:3}
.gift canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.gift:hover{transform:translate(-50%,-108%)}
.gift.shake{animation:shake .5s steps(4)}
@keyframes shake{0%,100%{rotate:0}25%{rotate:-9deg}50%{rotate:8deg}75%{rotate:-5deg}}
.bubble{position:absolute;z-index:6;background:var(--paper);color:var(--ink);font-size:12px;padding:3px 8px;box-shadow:0 0 0 2px var(--wood-dk),3px 3px 0 2px rgba(0,0,0,.3);white-space:nowrap;transform:translate(-50%,-100%);pointer-events:none}
/* 패널 */
.panel{min-width:0}
.ptitle{display:flex;justify-content:center;margin:-2px 0 8px}
.ptitle span{background:var(--red);color:#fff4d6;padding:4px 16px;box-shadow:0 0 0 3px var(--edge),inset 0 -3px 0 #a52a20}
.pbody{padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs button{background:var(--paper-2);color:var(--ink-2);border:0;padding:8px 6px;box-shadow:0 0 0 2px var(--wood-dk)}
.tabs button[aria-selected="true"]{background:var(--wood);color:#fff4d6;box-shadow:0 0 0 2px var(--edge),inset 0 -3px 0 var(--wood-dk)}
.desc{margin:0;font-size:13px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff3d4;text-align:center;padding:8px 4px;box-shadow:0 0 0 2px var(--wood-dk),inset -3px -3px 0 var(--paper-2)}
.stat b{display:block;font-family:var(--font-title);font-weight:400;font-size:28px;line-height:1.1;color:var(--red)}
.stat span{font-size:12px;color:var(--ink-2)}
.label{font-size:13px;color:var(--ink)}
.label::before{content:"★ ";color:var(--red)}
.link-row{display:flex;gap:8px}
.link-row code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff3d4;padding:9px 10px;font-family:var(--font-pixel);color:var(--ink);box-shadow:inset 0 0 0 2px var(--paper-2)}
.btn{border:0;padding:10px 14px;background:var(--green);color:#fff4d6;font-size:15px;box-shadow:0 0 0 3px var(--edge),inset 0 -4px 0 #276127,inset 0 3px 0 #5fb35a}
.btn.kakao{background:#fee500;color:#191600;width:100%;box-shadow:0 0 0 3px var(--edge),inset 0 -4px 0 #c9b400}
.btn:active{transform:translateY(2px)}
.wraps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wrap-opt{background:#fff3d4;border:0;padding:6px 2px 4px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--ink-2);box-shadow:0 0 0 2px var(--paper-2)}
.wrap-opt canvas{width:40px;height:40px;image-rendering:pixelated}
.wrap-opt[aria-pressed="true"]{box-shadow:0 0 0 3px var(--red);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);box-shadow:0 0 0 3px var(--wood-dk);padding:8px 14px;font-size:13px;opacity:0;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.gift.shake{animation:none}}
</style>

<body>
<div class="topbar"><a href="/">← 성탄맨션</a><span class="note">도트 샘플 3이에요. <a href="/santa/pixel-sample2.html" style="color:var(--gold)">샘플 2</a> · <a href="/santa/pixel-sample.html" style="color:var(--gold)">샘플 1</a></span></div>

<header class="head">
  <div>
    <h1 class="title">산타의 <span>비밀</span> 택배</h1>
    <p class="sub">성탄맨션 앞 광장, 커다란 트리 아래</p>
  </div>
  <div class="frame"><div class="paper dday">개봉까지 D-47</div></div>
</header>

<div class="main">
  <section class="stage frame" aria-label="눈 내린 광장">
    <div class="scene-wrap" id="sceneWrap">
      <canvas id="scene" width="192" height="144"></canvas>
      <canvas id="glow" width="768" height="576"></canvas>
      <div class="hint">상자를 누르면 흔들어 볼 수 있어요</div>
    </div>
  </section>

  <aside class="panel frame">
    <div class="paper">
      <div class="pbody">
        <div class="ptitle"><span>택배함</span></div>
        <div class="tabs"><button aria-selected="true">받는 사람</button><button aria-selected="false">보내는 친구</button></div>
        <p class="desc">친구들이 트리 아래 몰래 두고 간 선물은 12월 25일 0시에 열려요. 열고 나서 누가 보냈는지 맞혀 보세요.</p>
        <div class="stats">
          <div class="stat"><b>5</b><span>받은 선물</span></div>
          <div class="stat"><b>0</b><span>열어본 선물</span></div>
          <div class="stat"><b>0</b><span>맞힌 친구</span></div>
        </div>
        <span class="label">내 선물방 링크</span>
        <div class="link-row"><code>moodnight.co.kr/santa/r/251d5a02d3</code><button class="btn">복사</button></div>
        <button class="btn kakao">카카오톡으로 링크 보내기</button>
        <span class="label">포장지 미리보기</span>
        <div class="wraps" id="wraps"></div>
      </div>
    </div>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const W = 192, H = 144;
const cv = document.getElementById("scene"), ctx = cv.getContext("2d");
const bg = document.createElement("canvas"); bg.width = W; bg.height = H;
const b = bg.getContext("2d");
const gl = document.getElementById("glow"), g = gl.getContext("2d");
const hash = (x, y) => (((x * 73856093) ^ (y * 19349663) ^ (x * y * 83492791)) >>> 0) % 100;
const P = (c, x, y, w = 1, h = 1) => { b.fillStyle = c; b.fillRect(x, y, w, h); };

/* 마스크 도구: 채우고, 바깥 테두리를 자동으로 그림 */
const mask = () => new Uint8Array(W * H);
const inM = (m, x, y) => x >= 0 && y >= 0 && x < W && y < H && m[y * W + x];
function disc(m, cx, cy, r) { for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) if (x >= 0 && y >= 0 && x < W && y < H && (x - cx) ** 2 + (y - cy) ** 2 <= r * r) m[y * W + x] = 1; }
function outline(m, col) { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!m[y * W + x] && (inM(m, x - 1, y) || inM(m, x + 1, y) || inM(m, x, y - 1) || inM(m, x, y + 1))) P(col, x, y); }
function fill(m, fn) { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (m[y * W + x]) { const c = fn(x, y); if (c) P(c, x, y); } }

/* ── 바닥: 눈밭과 돌바닥 ── */
const snowEdge = x => 58 + Math.round(Math.sin(x / 11) * 2 + Math.sin(x / 5) * 1);
function ground() {
  // 돌바닥
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const row = Math.floor(y / 6), off = (row % 2) * 4, col = Math.floor((x + off) / 9);
    const lx = (x + off) % 9, ly = y % 6, v = hash(col, row);
    const ring = Math.hypot(x - 96, (y - 98) * 1.35);
    let base = v < 15 ? "#b48f66" : v < 30 ? "#d3b083" : "#c8a477", hi = "#e6c899", lo = "#a07c55", mortar = "#6e5238";
    if (ring < 40 && ring > 34) { base = "#9b5a3c"; hi = "#b9724d"; lo = "#7d4430"; }
    else if (ring <= 34) { base = v < 20 ? "#c39b70" : "#cfa97c"; }
    let c = base;
    if (lx === 0 || ly === 0) c = mortar;
    else if ((lx === 1 || lx === 8) && (ly === 1 || ly === 5)) c = mortar;
    else if (ly === 1 || lx === 1) c = hi;
    else if (ly === 5 || lx === 8) c = lo;
    P(c, x, y);
  }
  // 눈밭 (위쪽) + 그늘
  for (let x = 0; x < W; x++) {
    const e = snowEdge(x);
    for (let y = 0; y < e; y++) { const v = hash(Math.floor(x / 3), Math.floor(y / 2)); P(v < 7 ? "#dbe7f6" : "#eef4fc", x, y); }
    P("#bcd0ea", x, e, 1, 1); P("#9fb5d4", x, e + 1, 1, 1); P("rgba(80,100,150,.35)", x, e + 2, 1, 1);
  }
  // 아래 양옆 눈 더미
  [[0, 132, 26, 14], [170, 128, 26, 18]].forEach(([sx, sy, w, h]) => {
    const m = mask(); for (let i = 0; i < 6; i++) disc(m, sx + i * w / 5, sy + 6 + (i % 2), h / 2);
    outline(m, "#9fb5d4"); fill(m, (x, y) => (y > H - 5 ? "#dbe7f6" : "#f4f8ff"));
  });
}

/* ── 위쪽 눈 덮인 덤불 ── */
function hedge() {
  const m = mask();
  for (let x = -4; x < W + 8; x += 11) disc(m, x, 6 + (hash(x, 1) % 4), 9);
  outline(m, "#16264a");
  fill(m, (x, y) => {
    const v = hash(x, y);
    const top = y < 6 + (hash(Math.floor(x / 11) * 11, 1) % 4) - 3;
    if (top) return v < 15 ? "#d9e6f6" : "#ffffff";
    return v < 25 ? "#22406e" : v > 85 ? "#4a74a8" : "#2f5689";
  });
}

/* ── 울타리 + 가랜드 ── */
function fence(x0, x1, y) {
  for (let x = x0; x <= x1; x++) { P("#3a1a08", x, y + 2, 1, 4); P("#a8622f", x, y + 3, 1, 1); P("#7a4220", x, y + 4, 1, 1); }
  for (let x = x0; x <= x1; x += 12) {
    P("#3a1a08", x - 1, y - 4, 5, 13); P("#b9733b", x, y - 3, 3, 11); P("#d99a5c", x, y - 3, 1, 11); P("#7a4220", x + 2, y - 3, 1, 11);
    P("#ffffff", x - 1, y - 6, 5, 2); P("#d9e6f6", x, y - 5, 3, 1);
  }
  for (let x = x0; x <= x1; x++) { const yy = y + 1 + Math.round(Math.sin((x - x0) / 2.2)); P("#1d5a2a", x, yy, 1, 2); if ((x - x0) % 3 === 0) P("#4fae4a", x, yy, 1, 1); if ((x - x0) % 6 === 3) P(((x - x0) % 12 === 3) ? "#e8443a" : "#ffd04a", x, yy + 2, 1, 1); }
}

/* ── 사탕 지팡이 ── */
function cane(x, y, flip) {
  const pts = [];
  for (let j = 0; j < 22; j++) pts.push([x, y + j]);
  for (let a = 0; a <= 6; a++) { const t = Math.PI * a / 6; pts.unshift([x + Math.round((flip ? -1 : 1) * (3 - 3 * Math.cos(t))), y - Math.round(3 * Math.sin(t))]); }
  pts.forEach(([px, py]) => P("#3a1a08", px - 2, py - 1, 4, 3));
  pts.forEach(([px, py], i) => { const red = Math.floor((px + py) / 2) % 2 === 0; P(red ? "#e8443a" : "#ffffff", px - 1, py, 2, 1); P(red ? "#ff7a6a" : "#ffffff", px - 1, py, 1, 1); });
}

/* ── 가로등 ── */
function lamp(x, y) {
  P("#1a1a26", x - 4, y + 22, 9, 4); P("#3a3a52", x - 3, y + 22, 7, 2);
  P("#1a1a26", x - 2, y + 4, 5, 19); P("#4a4a66", x - 1, y + 5, 3, 17); P("#6a6a8a", x - 1, y + 5, 1, 17);
  for (let j = 0; j < 17; j += 4) { P("#2f8a3a", x - 2, y + 6 + j, 5, 2); P("#e8443a", x + 2, y + 7 + j, 1, 1); }
  P("#1a1a26", x - 4, y - 5, 9, 10); P("#ffe27a", x - 3, y - 4, 7, 8); P("#fff6c8", x - 2, y - 3, 2, 3); P("#1a1a26", x, y - 4, 1, 8);
  P("#1a1a26", x - 5, y - 7, 11, 3); P("#ffffff", x - 5, y - 9, 11, 2);
}

/* ── 풍성한 트리 ── */
const tree = { cx: 96, top: 14, base: 92 };
let treeMask, ornaments = [], lights = [];
function drawTree() {
  // 줄기
  P("#3a1a08", 92, 88, 9, 10); P("#7a4526", 93, 88, 7, 9); P("#5a3018", 97, 88, 3, 9);
  const m = mask(), owner = new Int16Array(W * H).fill(-1), blobs = [];
  for (let k = 0; k <= 9; k++) {
    const y = tree.top + 6 + k * 7.4, hw = 4 + k * 3.6;
    for (let x = -hw; x <= hw; x += 5) blobs.push([tree.cx + x + (hash(k, x + 50) % 3) - 1, y + (hash(x + 50, k) % 3), 4.6 + (k > 6 ? 0.8 : 0)]);
  }
  // 아래 덩어리가 위 덩어리를 덮도록 순서대로 칠함
  blobs.forEach(([cx, cy, r], i) => {
    for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++)
      if (x >= 0 && y >= 0 && x < W && y < H && (x - cx) ** 2 + (y - cy) ** 2 <= r * r) { m[y * W + x] = 1; owner[y * W + x] = i; }
  });
  treeMask = m;
  outline(m, "#0f2e1c");
  fill(m, (x, y) => {
    const [cx, cy, r] = blobs[owner[y * W + x]];
    const dx = (x - cx) / r, dy = (y - cy) / r, d = dx * dx + dy * dy, v = hash(x, y);
    const sideLight = x < tree.cx ? 1 : 0;
    if (d > 0.72 && dy > 0.1) return "#174d27";           // 덩어리 아래 테두리 그림자
    if (dy > 0.35) return "#1f6330";                       // 덩어리 아래쪽
    if (dx < -0.1 && dy < -0.15 && d < 0.6) return sideLight ? "#6cc85a" : "#4fae4a"; // 왼쪽 위 밝은 면
    if (dy < -0.55 && v < 40) return "#5fbf52";
    if (v < 6) return "#1f6330";                            // 약간의 잎 질감
    return "#2f8a3e";
  });
  // 오너먼트
  const cols = [["#ffd04a", "#c9961e"], ["#e8443a", "#a52a20"], ["#8a5cd6", "#5c3a9e"], ["#4a8be8", "#2a5cb0"]];
  ornaments = [];
  for (let i = 0; i < 400 && ornaments.length < 34; i++) {
    const x = tree.cx - 34 + (hash(i, 7) % 69), y = tree.top + 10 + (hash(7, i) % 72);
    if (!inM(m, x - 2, y) || !inM(m, x + 2, y) || !inM(m, x, y + 3) || !inM(m, x, y - 2)) continue;
    if (ornaments.some(o => Math.abs(o[0] - x) < 6 && Math.abs(o[1] - y) < 5)) continue;
    ornaments.push([x, y, cols[i % 4]]);
  }
  ornaments.forEach(([x, y, [c, lo]]) => {
    P("#0f2e1c", x - 1, y - 2, 3, 5); P("#0f2e1c", x - 2, y - 1, 5, 3);
    P(c, x - 1, y - 1, 3, 3); P(lo, x, y + 1, 2, 1); P(lo, x + 1, y, 1, 1); P("#ffffff", x - 1, y - 1, 1, 1);
  });
  // 전구 자리
  lights = [];
  for (let i = 0; i < 600 && lights.length < 46; i++) {
    const x = tree.cx - 34 + (hash(i, 13) % 69), y = tree.top + 8 + (hash(13, i) % 76);
    if (!inM(m, x, y) || ornaments.some(o => Math.abs(o[0] - x) < 3 && Math.abs(o[1] - y) < 3)) continue;
    lights.push([x, y, i]);
  }
}

/* ── 트리 별 ── */
function star(t) {
  const x = tree.cx, y = tree.top;
  const shape = ["...o...", "..oyo..", "ooyyyoo", "oyyWyyo", ".oyyyo.", ".oyoyo.", "oyo.oyo", "oo...oo"];
  shape.forEach((row, j) => [...row].forEach((c, i) => { if (c === ".") return; ctx.fillStyle = c === "o" ? "#7a4a08" : c === "W" ? "#ffffff" : (Math.floor(t / 500) % 2 ? "#ffe066" : "#ffd04a"); ctx.fillRect(x - 3 + i, y - 4 + j, 1, 1); }));
}

/* ── 눈토끼 택배원 ── */
function bunny(x, y, t) {
  const bob = Math.floor(t / 420) % 2;
  const spr = [
    "..o...o.....",
    ".oWo.oWo....",
    ".oPo.oPo....",
    ".oWo.oWo....",
    "..ooooooo...",
    ".oRRRRRRRoo.",
    "oRRRRRRRRRWo",
    "oWWWWWWWWWoo",
    "oWWWWWWWWWo.",
    "oWkWWWWkWWo.",
    "oWWPWkWPWWo.",
    ".oWWWWWWWo..",
    ".oRRRRRRRo..",
    "oRRRWWWRRRo.",
    "oRRRWWWRRRo.",
    ".oRRRRRRRo..",
    "..oWWo.oWWo.",
    "...oo...oo.."
  ];
  const col = { o: "#2a1a14", W: "#ffffff", P: "#ff9db0", R: "#e8443a", k: "#2a1a14" };
  spr.forEach((row, j) => [...row].forEach((c, i) => { if (col[c]) { ctx.fillStyle = col[c]; ctx.fillRect(x + i, y + j - bob * (j < 16 ? 1 : 0), 1, 1); } }));
  ctx.fillStyle = "rgba(60,80,120,.35)"; ctx.fillRect(x + 1, y + 18, 10, 1);
}

/* ── 배경 한 번 그리기 ── */
ground(); hedge();
fence(4, 64, 50); fence(128, 188, 50);
drawTree();
cane(12, 104, false); cane(180, 100, true);
lamp(28, 66); lamp(164, 66);
// 트리 그림자
for (let x = 64; x < 130; x++) { const w = Math.round(6 * Math.sqrt(1 - ((x - 97) / 33) ** 2) || 0); if (w > 0) { b.fillStyle = "rgba(40,30,20,.22)"; b.fillRect(x, 96, 1, w); } }

/* ── 애니메이션 ── */
const flakes = Array.from({ length: 70 }, (_, i) => ({ x: hash(i, 3) / 100 * 768, y: hash(3, i) / 100 * 576, s: 2 + (i % 3), v: 0.25 + (i % 5) * 0.08 }));
function frame(t) {
  ctx.drawImage(bg, 0, 0);
  lights.forEach(([x, y, i]) => {
    const on = (Math.floor(t / 380) + i) % 4;
    ctx.fillStyle = on === 0 ? "#2f8a3e" : ["#fff6c8", "#ffd04a", "#ffb0a0", "#c8e0ff"][i % 4];
    ctx.fillRect(x, y, 1, 1);
  });
  star(t);
  bunny(40, 102, t);
  // 빛과 눈
  g.clearRect(0, 0, 768, 576);
  const k = 4;
  const spot = (cx, cy, r, col, a) => { const gr = g.createRadialGradient(cx * k, cy * k, 0, cx * k, cy * k, r * k); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fillRect(0, 0, 768, 576); };
  spot(28, 62, 22, "255,200,90", 0.45 + Math.sin(t / 400) * 0.05);
  spot(164, 62, 22, "255,200,90", 0.45 + Math.cos(t / 420) * 0.05);
  spot(96, 12, 14, "255,225,110", 0.55 + Math.sin(t / 300) * 0.15);
  spot(96, 60, 44, "255,170,80", 0.12);
  g.fillStyle = "rgba(255,255,255,.9)";
  flakes.forEach(f => { f.y += f.v * (still ? 0 : 1); f.x += Math.sin((t / 900) + f.y / 60) * 0.2; if (f.y > 576) { f.y = -4; } g.fillRect(Math.round(f.x / 4) * 4, Math.round(f.y / 4) * 4, f.s > 3 ? 4 : 4, 4); });
  if (!still) requestAnimationFrame(frame);
}

/* ── 선물 상자 (위에서 비스듬히 본 모습) 16×16 ── */
const WRAPS = [
  { id: "red", name: "산타 레드", top: "#ff6a5a", b: "#e8443a", lo: "#a52a20", rib: "#ffd04a", ribLo: "#c9961e" },
  { id: "green", name: "전나무", top: "#5fbf52", b: "#3d8b3a", lo: "#256127", rib: "#e8443a", ribLo: "#a52a20" },
  { id: "purple", name: "라벤더", top: "#a07ae8", b: "#7a52c8", lo: "#4f3394", rib: "#ffd04a", ribLo: "#c9961e" },
  { id: "blue", name: "한밤 별빛", top: "#6aa2f0", b: "#3f73d6", lo: "#2a4c9e", rib: "#ffd04a", ribLo: "#c9961e" },
  { id: "gold", name: "금빛", top: "#ffe27a", b: "#f2b83a", lo: "#c08420", rib: "#e8443a", ribLo: "#a52a20" }
];
function giftSprite(w) {
  const c = document.createElement("canvas"); c.width = 16; c.height = 16;
  const q = c.getContext("2d"); const r = (col, x, y, ww = 1, hh = 1) => { q.fillStyle = col; q.fillRect(x, y, ww, hh); };
  r("#2a1a14", 1, 4, 14, 12);                // 외곽
  r(w.top, 2, 5, 12, 4);                      // 윗면
  r(w.b, 2, 9, 12, 6); r(w.lo, 2, 14, 12, 1); r(w.lo, 12, 9, 2, 6); // 앞면
  r("#2a1a14", 2, 9, 12, 1);                  // 모서리
  r(w.rib, 7, 5, 2, 10); r(w.ribLo, 8, 9, 1, 6); r(w.rib, 2, 6, 12, 2); r(w.ribLo, 2, 7, 12, 1);
  // 리본 매듭
  r("#2a1a14", 3, 1, 4, 5); r("#2a1a14", 9, 1, 4, 5); r(w.rib, 4, 2, 2, 3); r(w.rib, 10, 2, 2, 3); r("#ffffff", 4, 2, 1, 1);
  r("#2a1a14", 6, 3, 4, 4); r(w.rib, 7, 4, 2, 2);
  return c;
}
const boxes = [{ w: "red", x: 39, y: 76 }, { w: "purple", x: 63, y: 74 }, { w: "green", x: 33, y: 84 }, { w: "blue", x: 67, y: 83 }, { w: "gold", x: 50, y: 86 }];
const shakes = ["찰랑찰랑, 따뜻한 액체 소리가 나요", "종이가 사락사락 스쳐요", "아무 소리도 안 나요. 폭신폭신해요", "데굴데굴 굴러가는 소리가 나요", "반짝이는 무언가가 출렁여요"];
const wrapEl = document.getElementById("sceneWrap");
boxes.forEach((bx, i) => {
  const btn = document.createElement("button"); btn.className = "gift"; btn.style.left = bx.x + "%"; btn.style.top = bx.y + "%";
  btn.setAttribute("aria-label", "선물 상자");
  btn.appendChild(giftSprite(WRAPS.find(w => w.id === bx.w)));
  btn.onclick = () => { btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake"); toast(`흔들어 보니 ${shakes[i]}`); };
  wrapEl.appendChild(btn);
});
const bub = document.createElement("div"); bub.className = "bubble"; bub.textContent = "택배 왔어요!"; bub.style.left = "24%"; bub.style.top = "69%"; wrapEl.appendChild(bub);
const wraps = document.getElementById("wraps");
WRAPS.forEach((w, i) => {
  const btn = document.createElement("button"); btn.className = "wrap-opt"; btn.setAttribute("aria-pressed", i === 0);
  btn.appendChild(giftSprite(w)); btn.append(w.name);
  btn.onclick = () => wraps.querySelectorAll("button").forEach(z => z.setAttribute("aria-pressed", z === btn));
  wraps.appendChild(btn);
});
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2400); }
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
requestAnimationFrame(frame);
frame(0);
</script>
