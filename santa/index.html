<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>산타의 선물가게 | 무드나잇</title>
<meta name="description" content="친구들이 몰래 맡기고 간 선물과 메시지를 크리스마스에 열어 보고, 단서로 누가 보냈는지 맞히는 놀이. 링크 하나로 나만의 선물방을 만들어 보세요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="무드나잇">
<meta property="og:title" content="산타의 선물가게">
<meta property="og:description" content="친구가 몰래 맡긴 선물, 누가 보냈는지 맞혀 보세요. 12월 25일에 열려요.">
<meta property="og:image" content="https://www.moodnight.co.kr/santa/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://www.moodnight.co.kr/santa/">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C23A2E'/%3E%3Crect x='7' y='13' width='18' height='12' rx='2' fill='%23FFF3DA'/%3E%3Crect x='14.5' y='13' width='3' height='12' fill='%23D9A934'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
/* 산타의 선물가게: 위에서 내려다본 방 안 도트 장면(왼쪽) + 나무 테두리 양피지 창(오른쪽). 휴대폰은 위아래로 */
:root{
  color-scheme: dark;
  --sky:#1d2a4a;
  --wood:#b4622a; --wood-hi:#d98a45; --wood-dk:#6e3414; --edge:#3a1a08;
  --paper:#fbe4b4; --paper-2:#f2cf8d; --paper-3:#fff3d4; --ink:#5a2a10; --ink-2:#8a5530;
  --red:#d83a2e; --red-dk:#a52a20; --green:#3d8b3a; --green-dk:#276127; --gold:#ffd04a;
  --font-pixel:"Galmuri11","Galmuri9","Apple SD Gothic Neo","Malgun Gothic",monospace;
  --font-title:"Galmuri14","Galmuri11",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--sky);color:var(--paper)}
body{font-family:var(--font-pixel);font-size:14px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;
  background:radial-gradient(ellipse at 50% -10%,#33497c 0%,var(--sky) 60%) fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.frame{background:var(--wood);padding:6px;box-shadow:0 0 0 3px var(--edge),inset 0 3px 0 var(--wood-hi),inset 0 -3px 0 var(--wood-dk),6px 8px 0 rgba(0,0,0,.35)}
.paper{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 3px var(--paper-2),inset 0 0 0 5px var(--wood-dk)}

.topbar{max-width:1180px;margin:0 auto 14px;display:flex;justify-content:space-between;gap:12px;font-size:13px}
.topbar a{color:var(--gold);text-decoration:none}
.head{max-width:1180px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.title{margin:0;font-family:var(--font-title);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.15;color:#fff4d6;
  text-shadow:3px 0 0 var(--wood-dk),-3px 0 0 var(--wood-dk),0 3px 0 var(--wood-dk),0 -3px 0 var(--wood-dk),3px 3px 0 var(--wood-dk),-3px 3px 0 var(--wood-dk),3px -3px 0 var(--wood-dk),-3px -3px 0 var(--wood-dk),5px 6px 0 #0d1426}
.sub{margin:6px 0 0;color:#b9c4dc;font-size:13px}
.dday{font-size:15px;padding:7px 14px;font-variant-numeric:tabular-nums}
.dday.xmas{background:var(--red);color:#fff4d6}

.main{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.left-col{display:grid;gap:18px;position:sticky;top:12px;min-width:0}
@media (max-width:900px){.left-col{position:static}}
.scene-wrap{position:relative;aspect-ratio:192/144;max-width:100%;overflow:hidden;background:#5a3018;isolation:isolate}
.scene-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#scene{image-rendering:pixelated}
#glow{mix-blend-mode:screen;pointer-events:none;z-index:150}
#gifts{position:absolute;inset:0}
.room-hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(58,26,8,.88);color:#fff4d6;padding:3px 10px;font-size:12px;white-space:nowrap;pointer-events:none;z-index:200}
.bubble{position:absolute;left:47%;top:49%;z-index:190;background:var(--paper);color:var(--ink);font-size:12px;padding:3px 8px;box-shadow:0 0 0 2px var(--wood-dk),3px 3px 0 2px rgba(0,0,0,.3);white-space:nowrap;transform:translate(-50%,-100%);pointer-events:none}

/* 선물 상자 (도트 스프라이트) */
.spr{display:block;width:100%;height:100%;background-size:100% 100%;image-rendering:pixelated}
.gift{position:absolute;transform:translate(-50%,-100%);background:none;border:0;padding:0;width:8.34%;aspect-ratio:1;transition:left .9s steps(9),top .9s steps(9)}
.gift:hover{transform:translate(-50%,-108%)}
.gift.shake{animation:shake .5s steps(4)}
@keyframes shake{0%,100%{rotate:0}25%{rotate:-9deg}50%{rotate:8deg}75%{rotate:-5deg}}
.gift.new{animation:pop .4s .9s steps(3) both}
@keyframes pop{0%{scale:1}50%{scale:1.25}100%{scale:1}}
#gifts .gift .spr{filter:drop-shadow(2px 0 0 #fff3d0) drop-shadow(-2px 0 0 #fff3d0) drop-shadow(0 -2px 0 #fff3d0) drop-shadow(0 3px 0 rgba(30,10,0,.55))}
#gifts .gift:hover .spr{filter:drop-shadow(2px 0 0 #ffd04a) drop-shadow(-2px 0 0 #ffd04a) drop-shadow(0 -2px 0 #ffd04a) drop-shadow(0 3px 0 rgba(30,10,0,.55))}
.gift.is-hidden{opacity:.35}
.gift .tag{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:var(--red);color:#fff4d6;font-size:10px;line-height:1.5;padding:0 4px;box-shadow:0 0 0 1px var(--edge);white-space:nowrap;z-index:1}
.gift.static{position:relative;transform:none;display:inline-block;width:40px}
.gift.static:hover{transform:none}

/* 오른쪽 창 */
.panel{min-width:0}
#panelBody{padding:18px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
h2{font-family:var(--font-title);font-weight:400;font-size:21px;margin:0;line-height:1.3;color:var(--ink)}
.panel .sub,.sheet .sub{color:var(--ink-2);font-size:13px;margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper-3);text-align:center;padding:8px 4px;box-shadow:0 0 0 2px var(--wood-dk),inset -3px -3px 0 var(--paper-2)}
.stat b{display:block;font-family:var(--font-title);font-weight:400;font-size:26px;line-height:1.1;color:var(--red)}
.stat span{font-size:12px;color:var(--ink-2)}
.count{background:var(--green);color:#fff4d6;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 0 0 2px var(--edge),inset 0 -4px 0 var(--green-dk)}
.count.xmas{background:var(--red);box-shadow:0 0 0 2px var(--edge),inset 0 -4px 0 var(--red-dk)}
.count strong{font-family:var(--font-title);font-weight:400;font-size:26px;line-height:1}
.count p{margin:0;font-size:12px}
.count-note{max-width:12em;text-align:right}
.box{background:var(--paper-3);box-shadow:0 0 0 2px var(--paper-2);padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.label{font-size:13px;color:var(--ink)}
.label::before{content:"★ ";color:var(--red)}
.link-row{display:flex;gap:8px}
.link-row code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff;padding:9px 10px;font-family:var(--font-pixel);color:var(--ink);box-shadow:inset 0 0 0 2px var(--paper-2);user-select:all}
.btn{display:block;text-align:center;text-decoration:none;border:0;padding:10px 14px;background:var(--green);color:#fff4d6;font-size:15px;box-shadow:0 0 0 3px var(--edge),inset 0 -4px 0 var(--green-dk),inset 0 3px 0 #5fb35a}
.btn.red{background:var(--red);box-shadow:0 0 0 3px var(--edge),inset 0 -4px 0 var(--red-dk),inset 0 3px 0 #ff6a5a}
.btn.ghost{background:var(--paper-3);color:var(--ink);box-shadow:0 0 0 3px var(--wood-dk),inset 0 -4px 0 var(--paper-2)}
.btn.wide{width:100%}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.5;cursor:default}
.login{display:block;width:100%;border:0;padding:12px 16px;font-size:15px}
.login.kakao{background:#fee500;color:#191600;box-shadow:0 0 0 3px var(--edge),inset 0 -4px 0 #c9b400}
.login.google{background:#fff;color:#1f1f1f;box-shadow:0 0 0 3px var(--edge),inset 0 -4px 0 #d8d8d8}
.fine{font-size:12px;color:var(--ink-2);margin:0}
.fine a{color:var(--ink)}
.linkish{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;font-size:13px}
.err{color:var(--red);font-size:13px;margin:0}
input[type="text"],textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:0;padding:9px 11px;box-shadow:inset 0 0 0 2px var(--paper-2),0 0 0 2px var(--wood-dk)}
textarea{resize:vertical;min-height:84px}
input[type="text"]:focus,textarea:focus{outline:3px solid var(--gold)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}

/* 보내기 양식 */
.step{display:grid;gap:8px}
.step-h{display:flex;align-items:baseline;gap:8px;font-size:15px;color:var(--ink)}
.step-h i{font-style:normal;width:22px;height:22px;background:var(--red);color:#fff4d6;display:inline-grid;place-items:center;font-size:12px;flex:none;box-shadow:0 0 0 2px var(--edge)}
.step-h small{font-size:12px;color:var(--ink-2)}
.wraps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wrap-opt{background:var(--paper-3);border:0;padding:6px 2px 4px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--ink-2);box-shadow:0 0 0 2px var(--paper-2)}
.wrap-opt .gift.static{width:36px}
.wrap-opt[aria-pressed="true"]{box-shadow:0 0 0 3px var(--red);color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item-opt{background:var(--paper-3);border:0;padding:8px 4px;font-size:12px;line-height:1.35;color:var(--ink);box-shadow:0 0 0 2px var(--paper-2)}
.item-opt b{display:block;font-size:20px;font-weight:400}
.item-opt[aria-pressed="true"]{box-shadow:0 0 0 3px var(--red);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--paper-3);padding:5px 10px;font-size:12px;color:var(--ink);box-shadow:0 0 0 2px var(--paper-2)}
.chip.on{background:var(--wood);color:#fff4d6;box-shadow:0 0 0 2px var(--edge)}
.chip.more{background:none;box-shadow:0 0 0 2px var(--paper-2) inset;color:var(--ink-2)}
.hint-in{display:grid;gap:6px}
.auto-hint{background:var(--paper-3);padding:9px 11px;font-size:13px;color:var(--ink-2);box-shadow:inset 0 0 0 2px var(--paper-2)}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--green)}
.decoys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.for-real{display:grid;gap:8px}
.radio{display:flex;gap:10px;align-items:flex-start;background:var(--paper-3);padding:10px 12px;cursor:pointer;font-size:12px;color:var(--ink-2);box-shadow:0 0 0 2px var(--paper-2)}
.radio input{margin-top:3px;accent-color:var(--red)}
.radio b{display:block;color:var(--ink);font-size:14px;font-weight:400}
.for-real .note{margin:0;font-size:12px;color:var(--red)}
.sent-mark{display:grid;place-items:center;padding-top:6px}
.sent-mark .gift.static{width:72px}
.ad-slot{min-height:100px}

/* 방 아래 안내 카드 */
.side-card{padding:16px 18px;display:grid;gap:12px}
.side-card h3{font-family:var(--font-title);font-weight:400;font-size:17px;margin:0}
.preview{display:flex;align-items:center;gap:16px}
.preview .gift.static{width:72px;flex:none}
.preview p{margin:0;color:var(--ink-2);font-size:13px}
.preview b{display:block;font-weight:400;font-size:15px;color:var(--ink)}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;counter-reset:f}
.flow li{counter-increment:f;background:var(--paper-3);padding:10px;font-size:12px;color:var(--ink-2);line-height:1.45;box-shadow:0 0 0 2px var(--paper-2)}
.flow li::before{content:counter(f);display:block;font-family:var(--font-title);font-size:20px;color:var(--red);line-height:1.2}
.flow li b{display:block;color:var(--ink);font-weight:400}
.side-meta{display:flex;gap:8px;flex-wrap:wrap}
.side-meta span{font-size:12px;background:var(--paper-2);padding:2px 8px;color:var(--ink)}
@media (max-width:900px){.desk-only{display:none!important}}

/* 열기 창 */
.overlay{position:fixed;inset:0;background:rgba(8,12,24,.7);display:grid;place-items:center;z-index:500;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-wrap{width:min(460px,100%)}
.sheet{padding:36px 20px 22px;display:grid;gap:14px;position:relative}
.close{position:absolute;z-index:2;right:10px;top:4px;border:0;background:none;font-size:24px;line-height:1;color:var(--ink-2);padding:6px}
.stage-gift{display:grid;place-items:center;padding:14px 0 4px}
.stage-gift .gift.static{width:120px}
.stage-gift .gift.unwrap{animation:unwrap .7s steps(6) forwards}
@keyframes unwrap{0%{transform:none}30%{transform:rotate(-10deg) scale(1.05)}60%{transform:rotate(10deg) scale(1.15)}100%{transform:scale(1.6);opacity:0}}
.letter{background:#fffaf0;padding:16px 16px 14px;box-shadow:0 0 0 2px var(--wood-dk),4px 4px 0 2px rgba(0,0,0,.15);border-top:6px solid var(--red);background-image:repeating-linear-gradient(transparent 0 27px,#f1e3c6 27px 28px)}
.letter .item{display:inline-block;background:var(--paper-2);padding:1px 8px;font-size:12px;margin-bottom:8px}
.letter p{margin:0 0 10px;white-space:pre-wrap;line-height:28px;color:var(--ink)}
.from{text-align:right;font-size:15px;color:var(--ink)}
.from .q{display:inline-block;background:var(--ink);color:var(--paper);padding:0 8px;letter-spacing:.2em}
.stamp{display:inline-block;transform:rotate(-8deg);border:2px solid var(--red);color:var(--red);padding:0 6px;margin-right:8px;font-size:13px}
.stamp.miss{border-color:var(--ink-2);color:var(--ink-2)}
.guess-h{display:flex;justify-content:space-between;align-items:baseline}
.lives{font-size:13px;color:var(--red);letter-spacing:.1em}
.hints{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hints li{display:flex;gap:8px;align-items:center;background:#fff;padding:7px 10px;font-size:13px;color:var(--ink);box-shadow:0 0 0 2px var(--paper-2)}
.hints li.locked{color:var(--ink-2);background:var(--paper-3)}
.hints li em{font-style:normal;font-size:12px;color:var(--red);flex:none}
.cands{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cand{border:0;background:#fff;padding:10px;font-size:15px;color:var(--ink);box-shadow:0 0 0 2px var(--wood-dk),inset 0 -3px 0 var(--paper-2)}
.cand:hover:not(:disabled){background:var(--paper-3)}
.cand.wrong{text-decoration:line-through;color:var(--ink-2);background:var(--paper-2);cursor:default}
.guess-input{display:flex;gap:8px}
.guess-input input{flex:1;min-width:0}
.result{background:var(--paper-3);padding:10px 12px;font-size:13px;color:var(--ink);box-shadow:0 0 0 2px var(--paper-2)}
.result b{font-weight:400;color:var(--red);font-size:15px}
.mod-row{display:flex;justify-content:space-between;gap:12px;padding-top:6px;border-top:2px dashed var(--paper-2)}
.report{display:grid;gap:8px}
.real-card{background:#fff;padding:12px 14px;display:grid;gap:8px;box-shadow:0 0 0 3px var(--gold),0 0 0 5px var(--wood-dk)}
.real-card.for-real{box-shadow:0 0 0 3px var(--red),0 0 0 5px var(--wood-dk);background:#fff4ee}
.real-badge{justify-self:start;font-size:14px;color:#fff4d6;background:var(--red);padding:2px 12px;box-shadow:0 0 0 2px var(--edge)}
.real-row{display:flex;gap:12px;align-items:center}
.real-icon{font-size:2.4rem;line-height:1}
.real-row b{display:block;font-weight:400;font-size:17px;color:var(--ink)}
.real-row p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.real-card .fine a{color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);box-shadow:0 0 0 3px var(--wood-dk);padding:8px 14px;font-size:13px;opacity:0;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center;pointer-events:none;z-index:600}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.gift.shake,.gift.new,.stage-gift .gift.unwrap{animation:none}}
</style>
</head>
<body>
<nav class="topbar"><a href="/">← 무드나잇</a><a href="/santa/demo/">체험판</a></nav>
<header class="head">
  <div>
    <h1 class="title" id="title">산타의 선물가게</h1>
    <p class="sub">성탄맨션 1층, 친구들이 몰래 선물을 맡기고 가는 곳</p>
  </div>
  <div class="frame"><div class="paper dday" id="dday">개봉까지 D-47</div></div>
</header>
<div class="main">
  <div class="left-col">
    <section class="frame" aria-label="선물가게 안">
      <div class="scene-wrap" id="room">
        <canvas id="scene" width="192" height="144"></canvas>
        <div id="gifts"></div>
        <canvas id="glow" width="768" height="576"></canvas>
        <div class="bubble" id="bubble" aria-hidden="true"></div>
        <div class="room-hint" id="roomHint">선물을 눌러서 흔들어 보세요</div>
      </div>
    </section>
    <div class="frame" hidden id="sideWrap"><div class="paper side-card" id="sideCard" hidden></div></div>
  </div>
  <aside class="panel frame"><div class="paper"><div id="panelBody"><p class="sub">불러오는 중…</p></div></div></aside>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status"></div>
<script src="/santa/scene.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
<script src="/santa/gifts.js"></script>
<script src="/santa/app.js"></script>
</body>
</html>
