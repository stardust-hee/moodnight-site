<meta property="og:site_name" content="무드나잇">

<meta property="og:description" content="친구가 몰래 두고 간 선물을 크리스마스에 열고, 단서로 보낸 사람을 맞히는 산타의 선물가게를 미리 체험해 보세요.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C23A2E'/%3E%3Crect x='7' y='13' width='18' height='12' rx='2' fill='%23FFF3DA'/%3E%3Crect x='14.5' y='13' width='3' height='12' fill='%23D9A934'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
</head>
<body>
<style>
/* Layout: 장난감 디오라마 방(왼쪽) + 손편지 같은 조작 패널(오른쪽), 모바일은 위아래로 쌓임 */
:root{
  color-scheme: light;
  --paper:#EEE7DA;      /* 페이지 바탕 */
  --cream:#FBF7EF;      /* 카드/패널 */
  --ink:#3A2A22;        /* 본문 */
  --ink-soft:#7A6656;
  --line:#E2D6C2;
  --red:#C23A2E;
  --green:#2E6E46;
  --green-deep:#1F5134;
  --gold:#D9A934;
  --font-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

.app{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--red);display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:1.55rem;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:0;font-size:.82rem;color:var(--ink-soft)}
.dday{font-family:var(--font-display);background:var(--green);color:#FFF8EA;padding:6px 14px;border-radius:999px;font-size:1rem;font-variant-numeric:tabular-nums}
.dday.xmas{background:var(--red)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:24px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}

/* ── Diorama ── */
.frame{background:#FFFFFF;border-radius:44px;padding:clamp(10px,2.2vw,18px);box-shadow:0 18px 40px -18px rgba(80,50,20,.35)}
.room{position:relative;aspect-ratio:5/4;border-radius:30px;overflow:hidden;background:#EFE6D2;max-width:100%}
.room svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.room-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(40,25,15,.62);color:#FFF6E6;font-size:.78rem;padding:4px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}
.snow{animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(130px)}}
.twinkle{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}

/* ── Gift box ── */
.gift{position:absolute;width:12.5%;aspect-ratio:1/.92;transform:translate(-50%,-100%);background:none;border:0;padding:0;transition:left .9s cubic-bezier(.3,.7,.3,1),top .9s cubic-bezier(.3,.7,.3,1),transform .2s}
.gift:hover{transform:translate(-50%,-104%)}
.g-body{position:absolute;left:7%;right:7%;bottom:0;height:70%;background:var(--wrap);border-radius:3px;box-shadow:inset -7px -5px 0 rgba(0,0,0,.13),0 7px 6px -3px rgba(60,30,10,.4)}
.g-body::before,.g-lid::before{content:"";position:absolute;left:43%;width:14%;top:0;bottom:0;background:var(--ribbon)}
.g-lid{position:absolute;left:0;right:0;top:17%;height:20%;background:var(--wrap);border-radius:3px;z-index:2;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .7s cubic-bezier(.2,.8,.3,1)}
.g-bow{position:absolute;left:50%;top:2%;width:46%;height:22%;transform:translateX(-50%);z-index:3;transition:transform .7s cubic-bezier(.2,.8,.3,1)}
.g-bow::before,.g-bow::after{content:"";position:absolute;top:0;width:50%;height:100%;border:3px solid var(--ribbon);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.g-bow::before{left:0;transform:rotate(-18deg)}
.g-bow::after{right:0;transform:rotate(18deg)}
.gift.opened .g-lid{transform:translate(18%,-30%) rotate(14deg)}
.gift.opened .g-bow{transform:translate(-20%,-40%) rotate(14deg)}
.gift .tag{position:absolute;right:-6%;bottom:8%;z-index:4;background:#FFF8EA;color:var(--green-deep);font-size:.62rem;font-family:var(--font-display);padding:1px 5px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.25);white-space:nowrap}
.gift.shake{animation:shake .55s}
@keyframes shake{0%,100%{rotate:0}20%{rotate:-9deg}40%{rotate:8deg}60%{rotate:-6deg}80%{rotate:4deg}}
.gift.new{animation:pop .5s .9s both}
@keyframes pop{0%{scale:1}50%{scale:1.18}100%{scale:1}}
.gift.static{position:relative;transform:none;left:auto;top:auto}
.gift.static:hover{transform:none}

/* wraps */
.w-red{--wrap:radial-gradient(#F7E3CF 1.6px,transparent 2.2px) 0 0/9px 9px,#C23A2E;--ribbon:#E8BE45}
.w-green{--wrap:repeating-linear-gradient(0deg,rgba(255,255,255,.17) 0 3px,transparent 3px 10px),repeating-linear-gradient(90deg,rgba(255,255,255,.17) 0 3px,transparent 3px 10px),#2F6B3A;--ribbon:#D2392C}
.w-navy{--wrap:radial-gradient(#E9C25A 1.4px,transparent 2px) 0 0/8px 8px,#26365E;--ribbon:#D2392C}
.w-gold{--wrap:repeating-linear-gradient(135deg,#DDAA34 0 5px,#F0CF6E 5px 10px);--ribbon:#C23A2E}
.w-snow{--wrap:radial-gradient(#C23A2E 1.4px,transparent 2px) 0 0/9px 9px,#F7F1E6;--ribbon:#2E6E46}

/* ── Panel ── */
.panel{background:var(--cream);border-radius:24px;padding:18px;box-shadow:0 10px 30px -18px rgba(80,50,20,.35);display:grid;gap:16px;min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#EFE5D3;border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:9px 6px;border-radius:10px;font-family:var(--font-display);font-size:.98rem;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{background:var(--cream);color:var(--ink);box-shadow:0 2px 6px rgba(80,50,20,.15)}
h2{font-family:var(--font-display);font-weight:400;font-size:1.35rem;margin:0;line-height:1.25;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--ink-soft);font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#FFFFFF;border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.75rem;color:var(--ink-soft)}
.box{border:1px dashed #CDBB9E;border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.label{font-size:.78rem;color:var(--ink-soft);letter-spacing:.02em}
.link-row{display:flex;gap:8px;align-items:center}
.link-row code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:.85rem;user-select:all}
.btn{border:0;border-radius:12px;padding:10px 16px;font-family:var(--font-display);font-size:1rem;background:var(--green);color:#FFF8EA;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.btn:hover{background:var(--green-deep)}
.btn.red{background:var(--red)}
.btn.red:hover{background:#A42E24}
.btn.ghost{background:#FFFFFF;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.wide{width:100%;padding:13px}
.btn:disabled{opacity:.45;cursor:default}
.count{background:linear-gradient(160deg,#2E6E46,#1F5134);color:#FFF8EA;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.count.xmas{background:linear-gradient(160deg,#C23A2E,#962a21)}
.count strong{font-family:var(--font-display);font-weight:400;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.count p{margin:0;font-size:.85rem;opacity:.92}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.88rem;color:var(--ink-soft)}
.switch input{appearance:none;width:44px;height:26px;border-radius:99px;background:#D8CBB5;position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;transition:left .2s}
.switch input:checked{background:var(--red)}
.switch input:checked::after{left:21px}

/* sender form */
.step{display:grid;gap:8px}
.step-h{display:flex;align-items:baseline;gap:8px;font-family:var(--font-display);font-size:1.02rem}
.step-h i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--cream);display:inline-grid;place-items:center;font-size:.78rem;flex:none}
.step-h small{font-family:var(--font-body);font-size:.78rem;color:var(--ink-soft)}
.wraps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wrap-opt{border:2px solid transparent;background:#FFFFFF;border-radius:12px;padding:8px 4px 4px;display:grid;justify-items:center;gap:2px;font-size:.68rem;color:var(--ink-soft)}
.wrap-opt[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.wrap-opt .gift{width:70%}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.item-opt{border:2px solid var(--line);background:#FFFFFF;border-radius:12px;padding:8px 6px;font-size:.82rem;line-height:1.3}
.item-opt[aria-pressed="true"]{border-color:var(--ink);background:#FFF6E3}
.item-opt b{display:block;font-size:1.25rem;font-weight:400}
textarea,input[type="text"]{width:100%;font:inherit;color:var(--ink);background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
textarea{resize:vertical;min-height:84px}
textarea:focus,input[type="text"]:focus{outline:2px solid var(--gold);border-color:transparent}
.hint-in{display:grid;gap:6px}
.err{color:var(--red);font-size:.82rem;margin:0}
.meta{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-soft)}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(35,22,14,.6);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet{background:var(--cream);border-radius:26px;width:min(460px,100%);padding:22px 20px;display:grid;gap:16px;position:relative;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:1.5rem;line-height:1;color:var(--ink-soft);padding:6px}
.stage-gift{display:grid;place-items:center;padding:18px 0 4px}
.stage-gift .gift{width:150px}
.stage-gift .gift.unwrap .g-lid{transform:translate(70%,-160%) rotate(38deg)}
.stage-gift .gift.unwrap .g-bow{transform:translate(40%,-260%) rotate(50deg);opacity:0;transition:transform .7s,opacity .7s}
.letter{background:#FFFFFF;border-radius:6px;padding:18px 18px 16px;box-shadow:0 6px 18px -8px rgba(80,50,20,.4);border-top:6px solid var(--red);background-image:repeating-linear-gradient(transparent 0 27px,#F1E8DA 27px 28px);animation:rise .5s ease-out}
.letter .item{display:inline-block;background:#FFF2D9;border-radius:99px;padding:2px 10px;font-size:.8rem;margin-bottom:8px}
.letter p{margin:0 0 10px;white-space:pre-wrap;line-height:28px}
.from{text-align:right;font-family:var(--font-display);font-size:1.1rem}
.from .q{display:inline-block;background:var(--ink);color:var(--cream);border-radius:6px;padding:0 10px;letter-spacing:.2em}
.stamp{display:inline-block;transform:rotate(-8deg);border:2px solid var(--red);color:var(--red);border-radius:8px;padding:0 8px;margin-right:8px;font-size:.9rem;animation:stampIn .35s ease-out}
.stamp.miss{border-color:var(--ink-soft);color:var(--ink-soft)}
@keyframes stampIn{from{transform:rotate(-8deg) scale(1.8);opacity:0}}
.hints{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hints li{display:flex;gap:8px;align-items:center;background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:.9rem}
.hints li.locked{color:var(--ink-soft);background:#F4ECDD;border-style:dashed}
.hints li em{font-style:normal;font-family:var(--font-display);font-size:.8rem;color:var(--gold);flex:none}
.cands{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cand{border:2px solid var(--line);background:#FFFFFF;border-radius:12px;padding:10px;font-family:var(--font-display);font-size:1.05rem}
.cand:hover:not(:disabled){border-color:var(--ink)}
.cand.wrong{text-decoration:line-through;color:var(--ink-soft);background:#F4ECDD;cursor:default}
.cand.right{border-color:var(--green);background:#E5F1E8;color:var(--green-deep)}
.guess-h{display:flex;justify-content:space-between;align-items:baseline}
.lives{font-size:.85rem;color:var(--red);letter-spacing:.1em}
.result{background:#FFF2D9;border-radius:14px;padding:12px 14px;font-size:.92rem}
.result b{font-family:var(--font-display);font-weight:400;font-size:1.1rem}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#FFF8EA;padding:10px 16px;border-radius:14px;font-size:.9rem;opacity:0;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>
.demo-bar{max-width:1080px;margin:0 auto 14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:.85rem;color:var(--ink-soft);background:#FFF6E3;border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.panel div{min-width:0}
[hidden]{display:none!important}
body{margin:0}
.demo-bar a{color:var(--green-deep);font-weight:700;text-decoration:none}
</style>


<div class="demo-bar"><a href="/santa/">← 진짜 선물가게 만들기</a><span>체험판입니다. 예시 데이터로 움직이며, 새로고침하면 처음 상태로 돌아가요.</span></div>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2" fill="#FFF3DA"/><rect x="2" y="6" width="20" height="5" rx="1.5" fill="#FFE9B8"/><rect x="10.5" y="6" width="3" height="15" fill="#D9A934"/><path d="M12 6c-2-4-6-3-5 0M12 6c2-4 6-3 5 0" stroke="#D9A934" stroke-width="2" fill="none"/></svg>
      </div>
      <div><h1>산타의 선물가게</h1><p>익명의 친구에게 받는 크리스마스 선물</p></div>
    </div>
    <div class="dday" id="dday">D-52</div>
  </header>

  <div class="main">
    <section class="frame" aria-label="선물가게">
      <div class="room" id="room">
        <svg class="scene" viewBox="0 0 500 400" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#FFE7A8"/><stop offset="1" stop-color="#F6C86A"/></linearGradient>
            <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9693A"/><stop offset="1" stop-color="#C98A50"/></linearGradient>
            <clipPath id="win"><rect x="150" y="62" width="96" height="112" rx="3"/></clipPath>
          </defs>
          <!-- shell -->
          <polygon points="0,0 500,0 430,32 70,32" fill="#F6EFE1"/>
          <polygon points="70,32 430,32 430,250 70,250" fill="#EFE5D0"/>
          <polygon points="0,0 70,32 70,250 0,400" fill="#E4D7BC"/>
          <polygon points="500,0 430,32 430,250 500,400" fill="#DCCBAA"/>
          <polygon points="0,400 500,400 430,250 70,250" fill="url(#wood)"/>
          <g stroke="#94592E" stroke-width="1" opacity=".45">
            <line x1="130" y1="250" x2="70" y2="400"/><line x1="190" y1="250" x2="160" y2="400"/><line x1="250" y1="250" x2="250" y2="400"/><line x1="310" y1="250" x2="340" y2="400"/><line x1="370" y1="250" x2="430" y2="400"/>
          </g>
          <!-- wainscot -->
          <rect x="70" y="214" width="360" height="36" fill="#E6D9BF"/>
          <line x1="70" y1="214" x2="430" y2="214" stroke="#D3C3A3" stroke-width="2"/>
          <!-- window -->
          <rect x="144" y="56" width="108" height="124" rx="5" fill="#FFFFFF"/>
          <rect x="150" y="62" width="96" height="112" rx="3" fill="#1D2B4E"/>
          <g clip-path="url(#win)" id="snowfield"></g>
          <path d="M150 160 Q175 150 198 158 T246 154 V174 H150Z" fill="#F4F6FA" clip-path="url(#win)"/>
          <line x1="198" y1="62" x2="198" y2="174" stroke="#FFFFFF" stroke-width="4"/>
          <line x1="150" y1="116" x2="246" y2="116" stroke="#FFFFFF" stroke-width="4"/>
          <!-- curtains -->
          <path d="M132 46 H162 Q156 120 166 190 H128 Q136 120 132 46Z" fill="#B8352B"/>
          <path d="M234 46 H264 Q260 120 268 190 H230 Q240 120 234 46Z" fill="#B8352B"/>
          <path d="M140 50 Q142 120 138 186" stroke="#962a21" stroke-width="2" fill="none"/>
          <path d="M256 50 Q252 120 258 186" stroke="#962a21" stroke-width="2" fill="none"/>
          <!-- garland -->
          <path d="M72 40 Q125 66 198 48 Q270 32 322 52 Q378 70 428 40" stroke="#2F6B3A" stroke-width="9" fill="none" stroke-linecap="round"/>
          <g fill="#C23A2E"><circle cx="108" cy="54" r="3"/><circle cx="160" cy="56" r="3"/><circle cx="252" cy="44" r="3"/><circle cx="300" cy="48" r="3"/><circle cx="360" cy="60" r="3"/><circle cx="404" cy="50" r="3"/></g>
          <path d="M184 48 q14 -14 28 0 q-14 10 -28 0Z" fill="#C23A2E"/>
          <path d="M187 56 a9 11 0 0 1 18 0 l2 10 h-22Z" fill="#E2B33C"/>
          <path d="M200 58 a9 11 0 0 1 18 0 l2 10 h-22Z" fill="#D9A934"/>
          <!-- hanging snowflakes -->
          <g stroke="#FFFFFF" stroke-width="1.2">
            <line x1="22" y1="6" x2="22" y2="70"/><line x1="44" y1="14" x2="44" y2="110"/><line x1="58" y1="20" x2="58" y2="64"/>
          </g>
          <g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round">
            <g transform="translate(22 78)"><line x1="-9" y1="0" x2="9" y2="0"/><line x1="-4.5" y1="-7.8" x2="4.5" y2="7.8"/><line x1="4.5" y1="-7.8" x2="-4.5" y2="7.8"/></g>
            <g transform="translate(44 120)"><line x1="-11" y1="0" x2="11" y2="0"/><line x1="-5.5" y1="-9.5" x2="5.5" y2="9.5"/><line x1="5.5" y1="-9.5" x2="-5.5" y2="9.5"/></g>
            <g transform="translate(58 71)"><line x1="-7" y1="0" x2="7" y2="0"/><line x1="-3.5" y1="-6" x2="3.5" y2="6"/><line x1="3.5" y1="-6" x2="-3.5" y2="6"/></g>
          </g>
          <!-- rug -->
          <ellipse cx="300" cy="318" rx="160" ry="44" fill="#9E2C24"/>
          <ellipse cx="300" cy="318" rx="146" ry="37" fill="none" stroke="#E7C27A" stroke-width="2" stroke-dasharray="6 5"/>
          <!-- tree -->
          <rect x="291" y="246" width="18" height="18" fill="#7A4A2A"/>
          <polygon points="300,72 252,150 348,150" fill="#2F6B3A"/>
          <polygon points="300,72 300,150 348,150" fill="#285D33"/>
          <polygon points="300,108 236,202 364,202" fill="#2F6B3A"/>
          <polygon points="300,108 300,202 364,202" fill="#285D33"/>
          <polygon points="300,146 220,252 380,252" fill="#2F6B3A"/>
          <polygon points="300,146 300,252 380,252" fill="#285D33"/>
          <path d="M262 140 Q300 156 340 136 M248 192 Q300 212 356 186 M234 240 Q300 262 370 232" stroke="#E2B33C" stroke-width="2" fill="none"/>
          <g fill="#C23A2E"><circle cx="282" cy="128" r="5"/><circle cx="322" cy="176" r="5.5"/><circle cx="262" cy="214" r="6"/><circle cx="346" cy="228" r="6"/></g>
          <g fill="#E2B33C"><circle cx="314" cy="118" r="4.5"/><circle cx="270" cy="180" r="5"/><circle cx="304" cy="228" r="5.5"/></g>
          <g fill="#FFF3B0" id="lights"></g>
          <polygon points="300,56 305,68 318,68 308,76 312,89 300,81 288,89 292,76 282,68 295,68" fill="#F2C84B" stroke="#D9A934" stroke-width="1"/>
          <!-- doorway + door -->
          <polygon points="446,82 490,62 490,376 446,282" fill="url(#glow)"/>
          <polygon points="490,62 412,80 412,388 490,376" fill="#2E7D4F"/>
          <polygon points="490,62 486,63 486,377 490,376" fill="#1F5134"/>
          <polygon points="474,82 424,94 424,214 474,206" fill="#34895A"/>
          <polygon points="474,224 424,232 424,370 474,364" fill="#34895A"/>
          <circle cx="449" cy="152" r="21" fill="none" stroke="#2F6B3A" stroke-width="9"/>
          <g fill="#C23A2E"><circle cx="434" cy="144" r="2.5"/><circle cx="462" cy="140" r="2.5"/><circle cx="458" cy="168" r="2.5"/></g>
          <path d="M442 170 q7 -8 14 0 l-4 22 M449 172 l-6 20" stroke="#C23A2E" stroke-width="3" fill="none"/>
          <rect x="418" y="228" width="6" height="22" rx="3" fill="#E2B33C"/>
        </svg>
        <div id="gifts"></div>
        <div class="room-hint" id="roomHint">선물을 눌러서 흔들어 보세요</div>
      </div>
    </section>

    <aside class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabHost" aria-selected="true">받는 사람 화면</button>
        <button role="tab" id="tabSend" aria-selected="false">보내는 친구 화면</button>
      </div>
      <div id="panelBody"></div>
    </aside>
  </div>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
const HOST = "하린";
const WRAPS = [
  {id:"red", name:"산타 레드"},{id:"green", name:"전나무 체크"},{id:"navy", name:"한밤 별빛"},
  {id:"gold", name:"금빛 줄무늬"},{id:"snow", name:"눈송이"}
];
const ITEMS = [
  {id:"cocoa", icon:"☕", name:"핫초코 한 잔", shake:"찰랑찰랑, 따뜻한 액체 소리가 나요"},
  {id:"mitten", icon:"🧤", name:"털장갑", shake:"아무 소리도 안 나요. 폭신폭신해요"},
  {id:"tangerine", icon:"🍊", name:"귤 한 박스", shake:"데굴데굴 굴러가는 소리가 나요"},
  {id:"letter", icon:"💌", name:"행운 편지", shake:"종이가 사락사락 스쳐요"},
  {id:"globe", icon:"🔮", name:"스노우볼", shake:"반짝이는 무언가가 출렁여요"},
  {id:"ticket", icon:"🎟", name:"영화 데이트권", shake:"얇고 가벼워요. 거의 비어 있는 것 같아요"}
];
const POOL = ["민지","준호","소연","태훈","다은","현우","지아","서준"];
const SLOTS = [{x:44,y:79},{x:60,y:80},{x:34,y:87},{x:52,y:90},{x:70,y:88},{x:24,y:95},{x:42,y:98},{x:62,y:98},{x:79,y:96},{x:28,y:79}];

let gifts = [
  {from:"민지", wrap:"red", item:"cocoa", msg:"올해 제일 많이 웃은 날은 다 너랑 있던 날이었어.\n내년에도 퇴근길 수다 같이 떨자!", hints:["우리는 같은 동아리였어요","고양이 두 마리랑 살아요","이름이 'ㅁ'으로 시작해요"]},
  {from:"준호", wrap:"green", item:"mitten", msg:"손 차갑다고 맨날 투덜대길래.\n이번 겨울엔 주머니에서 손 좀 빼고 다녀.", hints:["지난주에 너랑 밥을 먹었어요","운동화를 정말 좋아해요","너보다 키가 커요"]},
  {from:"소연", wrap:"navy", item:"letter", msg:"힘들었던 시기에 먼저 연락해줘서 고마웠어.\n그 메시지 아직도 캡처해 뒀어.", hints:["초등학교 때부터 알았어요","노래방 18번이 발라드예요","이름에 받침이 하나 있어요"]},
  {from:"태훈", wrap:"gold", item:"tangerine", msg:"작년 크리스마스 파티 때 귤 까주던 거 기억나?\n올해는 내가 박스째로 까줄게.", hints:["같은 팀에서 일해요","커피는 무조건 아이스예요","올해 처음 같이 여행을 갔어요"]}
].map(g=>({...g, opened:false, wrongs:[], result:null, cands:null}));

let isXmas = false, view = "host", score = 0;
let draft = {wrap:"red", item:null, msg:"", hints:["","",""], name:""}, draftErr = "";

const $ = s => document.querySelector(s);
const item = id => ITEMS.find(i=>i.id===id);
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const giftHTML = (wrap, cls="") => `<span class="g-lid"></span><span class="g-body"></span><span class="g-bow"></span>`;

function daysLeft(){
  const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(0, Math.round((new Date(2026,11,25) - today)/86400000));
}
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),2600); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* window snow + tree lights */
(function(){
  const f=$("#snowfield");
  for(let i=0;i<16;i++){
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",152+Math.random()*92); c.setAttribute("cy",50+Math.random()*30); c.setAttribute("r",(1+Math.random()*1.6).toFixed(1));
    c.setAttribute("fill","#FFFFFF"); c.setAttribute("class","snow");
    c.style.animationDuration=(4+Math.random()*4)+"s"; c.style.animationDelay=(-Math.random()*8)+"s";
    f.appendChild(c);
  }
  const L=$("#lights"); [[290,100],[310,142],[276,158],[332,160],[256,204],[294,196],[340,206],[246,244],[284,240],[320,248],[360,238]].forEach(([x,y],i)=>{
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",2.2);c.setAttribute("class","twinkle");c.style.animationDelay=(i*.27)+"s";L.appendChild(c);
  });
})();

function renderGifts(newIndex=-1){
  const wrap=$("#gifts"); wrap.innerHTML="";
  gifts.forEach((g,i)=>{
    const s=SLOTS[i%SLOTS.length];
    const b=document.createElement("button");
    b.className=`gift w-${g.wrap}${g.opened?" opened":""}`;
    b.innerHTML=giftHTML()+(g.opened?`<span class="tag">${g.result==="right"?"정답":"개봉"}</span>`:"");
    b.setAttribute("aria-label",`선물 ${i+1}${g.opened?" (열어봄)":""}`);
    b.style.zIndex=Math.round(s.y);
    if(i===newIndex){ b.style.left="88%"; b.style.top="80%"; b.classList.add("new");
      requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.left=s.x+"%"; b.style.top=s.y+"%";}));
    } else { b.style.left=s.x+"%"; b.style.top=s.y+"%"; }
    b.onclick=()=>onGift(i,b);
    wrap.appendChild(b);
  });
  $("#roomHint").textContent = isXmas ? "선물을 눌러서 열어 보세요" : "선물을 눌러서 흔들어 보세요";
}

function onGift(i,el){
  const g=gifts[i];
  if(!isXmas){
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    toast(`흔들어 보니 ${item(g.item).shake}. 12월 25일에 열 수 있어요`);
    return;
  }
  openModal(i);
}

function renderTop(){
  const d=daysLeft(); const el=$("#dday");
  el.textContent = isXmas ? "Merry Christmas" : `개봉까지 D-${d}`;
  el.classList.toggle("xmas",isXmas);
}

function renderPanel(){
  $("#tabHost").setAttribute("aria-selected",view==="host");
  $("#tabSend").setAttribute("aria-selected",view==="send");
  view==="host" ? renderHost() : renderSend();
}

function renderHost(){
  const opened=gifts.filter(g=>g.opened).length;
  $("#panelBody").innerHTML=`
  <div style="display:grid;gap:16px">
    <div><h2>${HOST}의 선물가게</h2><p class="sub">누가 보냈는지는 크리스마스에 직접 맞혀야 알 수 있어요.</p></div>
    <div class="stats">
      <div class="stat"><b>${gifts.length}</b><span>받은 선물</span></div>
      <div class="stat"><b>${opened}</b><span>열어본 선물</span></div>
      <div class="stat"><b>${gifts.filter(g=>g.result==="right").length}</b><span>맞힌 친구</span></div>
    </div>
    <div class="count ${isXmas?"xmas":""}">
      ${isXmas
        ? `<div><p>오늘은 12월 25일</p><strong>선물 열기</strong></div><p style="max-width:12em;text-align:right">방 안의 선물을 눌러 리본을 풀어 보세요</p>`
        : `<div><p>12월 25일 0시에 열려요</p><strong>D-${daysLeft()}</strong></div><p style="max-width:12em;text-align:right">그전엔 흔들어서 단서만 들을 수 있어요</p>`}
    </div>
    <div class="box">
      <span class="label">내 선물가게 링크</span>
      <div class="link-row"><code id="linkTxt">santa.moodnight.co.kr/r/harin-7q2x</code><button class="btn" id="copyBtn">복사</button></div>
      <span class="sub" style="margin:0">카톡·인스타 스토리에 올리면 친구들이 몰래 선물을 두고 가요.</span>
    </div>
    <label class="switch" for="xmasToggle">데모: 크리스마스 아침으로 이동<input type="checkbox" id="xmasToggle" ${isXmas?"checked":""}></label>
  </div>`;
  $("#copyBtn").onclick=async()=>{
    try{ await navigator.clipboard.writeText("https://santa.moodnight.co.kr/r/harin-7q2x"); toast("링크를 복사했어요"); }
    catch(e){ const r=document.createRange(); r.selectNodeContents($("#linkTxt")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("링크를 선택했어요. 길게 눌러 복사하세요"); }
  };
  $("#xmasToggle").onchange=e=>{ isXmas=e.target.checked; renderTop(); renderGifts(); renderHost();
    toast(isXmas?"12월 25일 아침이에요. 선물을 열어 보세요":"다시 크리스마스 전으로 돌아왔어요"); };
}

function renderSend(){
  const d=draft;
  $("#panelBody").innerHTML=`
  <div style="display:grid;gap:18px">
    <div><h2>${HOST}에게 몰래 선물하기</h2><p class="sub">이름은 숨겨져요. ${HOST}가 단서를 보고 당신을 맞혀야 해요.</p></div>
    <div class="step">
      <div class="step-h"><i>1</i>포장지 고르기</div>
      <div class="wraps">${WRAPS.map(w=>`<button class="wrap-opt" data-wrap="${w.id}" aria-pressed="${d.wrap===w.id}"><span class="gift static w-${w.id}">${giftHTML()}</span>${w.name}</button>`).join("")}</div>
    </div>
    <div class="step">
      <div class="step-h"><i>2</i>상자 속 선물 <small>${HOST}에게 어울리는 걸로</small></div>
      <div class="items">${ITEMS.map(it=>`<button class="item-opt" data-item="${it.id}" aria-pressed="${d.item===it.id}"><b>${it.icon}</b>${it.name}</button>`).join("")}</div>
    </div>
    <div class="step">
      <div class="step-h"><i>3</i>메시지</div>
      <textarea id="msg" maxlength="200" placeholder="크리스마스에 열어볼 메시지를 남겨 주세요">${esc(d.msg)}</textarea>
      <div class="meta"><span>말투에서 들키지 않게 조심하세요</span><span id="msgCount">${d.msg.length}/200</span></div>
    </div>
    <div class="step">
      <div class="step-h"><i>4</i>나를 맞힐 단서 3개 <small>쉬운 단서일수록 뒤에</small></div>
      <div class="hint-in">
        ${[0,1,2].map(n=>`<input type="text" id="hint${n}" maxlength="40" value="${esc(d.hints[n])}" placeholder="${["예: 우리는 같은 동아리였어요","예: 고양이랑 살아요","예: 이름이 'ㅁ'으로 시작해요"][n]}">`).join("")}
      </div>
    </div>
    <div class="step">
      <div class="step-h"><i>5</i>내 이름 <small>정답으로만 쓰여요</small></div>
      <input type="text" id="name" maxlength="10" value="${esc(d.name)}" placeholder="${HOST}가 알고 있는 이름">
    </div>
    ${draftErr?`<p class="err">${draftErr}</p>`:""}
    <button class="btn red wide" id="sendBtn">선물 몰래 두고 오기</button>
  </div>`;
  document.querySelectorAll("[data-wrap]").forEach(b=>b.onclick=()=>{draft.wrap=b.dataset.wrap; renderSend();});
  document.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>{draft.item=b.dataset.item; renderSend();});
  $("#msg").oninput=e=>{draft.msg=e.target.value; $("#msgCount").textContent=`${draft.msg.length}/200`;};
  [0,1,2].forEach(n=>$("#hint"+n).oninput=e=>draft.hints[n]=e.target.value);
  $("#name").oninput=e=>draft.name=e.target.value;
  $("#sendBtn").onclick=sendGift;
}

function sendGift(){
  const d=draft;
  if(!d.item) draftErr="상자에 넣을 선물을 골라 주세요.";
  else if(d.msg.trim().length<5) draftErr="메시지를 5자 이상 써 주세요.";
  else if(d.hints.some(h=>!h.trim())) draftErr="단서 3개를 모두 채워 주세요. 추리할 거리가 있어야 재밌어요.";
  else if(!d.name.trim()) draftErr="정답이 될 내 이름을 적어 주세요.";
  else draftErr="";
  if(draftErr){ renderSend(); return; }
  gifts.push({from:d.name.trim(), wrap:d.wrap, item:d.item, msg:d.msg.trim(), hints:d.hints.map(h=>h.trim()), opened:false, wrongs:[], result:null, cands:null});
  draft={wrap:"red", item:null, msg:"", hints:["","",""], name:""};
  renderGifts(gifts.length-1); renderSend();
  toast(`${HOST}의 방에 선물을 몰래 두고 나왔어요`);
}

/* ── Open & guess ── */
let cur=-1, unwrapped=false;
function openModal(i){
  cur=i; const g=gifts[i]; unwrapped=g.opened;
  if(!g.cands){ g.cands=shuffle([g.from,...shuffle(POOL.filter(n=>n!==g.from)).slice(0,3)]); }
  $("#overlay").hidden=false; renderModal();
}
function closeModal(){ $("#overlay").hidden=true; cur=-1; renderGifts(); if(view==="host") renderHost(); }

function renderModal(){
  const g=gifts[cur], it=item(g.item);
  const shown = g.result ? 3 : Math.min(3, 1+g.wrongs.length);
  const lives = 3-g.wrongs.length;
  let html=`<button class="close" id="closeBtn" aria-label="닫기">×</button>`;
  if(!unwrapped){
    html+=`<div><h2>누군가 두고 간 선물</h2><p class="sub">${it.shake}.</p></div>
      <div class="stage-gift"><span class="gift static w-${g.wrap}" id="bigGift">${giftHTML()}</span></div>
      <button class="btn red wide" id="unwrapBtn">리본 풀기</button>`;
  } else {
    html+=`<div class="letter">
        <span class="item">${it.icon} ${it.name}</span>
        <p>To. ${HOST}\n${esc(g.msg)}</p>
        <div class="from">${g.result?`<span class="stamp ${g.result==="right"?"":"miss"}">${g.result==="right"?"정답":"공개"}</span>`:""}From. ${g.result?esc(g.from):`<span class="q">???</span>`}</div>
      </div>
      <div class="guess-h"><h2 style="font-size:1.15rem">보낸 친구는 누구일까요?</h2>${g.result?"":`<span class="lives" aria-label="남은 기회 ${lives}번">${"●".repeat(lives)}${"○".repeat(3-lives)}</span>`}</div>
      <ul class="hints">${g.hints.map((h,n)=>n<shown?`<li><em>단서 ${n+1}</em>${esc(h)}</li>`:`<li class="locked"><em>단서 ${n+1}</em>틀리면 열려요</li>`).join("")}</ul>
      <div class="cands">${g.cands.map(c=>{
        const wrong=g.wrongs.includes(c), right=g.result&&c===g.from;
        return `<button class="cand ${wrong?"wrong":""} ${right?"right":""}" data-c="${esc(c)}" ${(wrong||g.result)?"disabled":""}>${esc(c)}</button>`;}).join("")}</div>
      ${g.result==="right"?`<div class="result"><b>정답!</b> 단서 ${g.wrongs.length+1}개 만에 맞혔어요. ${esc(g.from)}에게 고맙다고 답장해 보세요.</div>`:""}
      ${g.result==="miss"?`<div class="result"><b>아쉽게 놓쳤어요</b> 이 선물은 ${esc(g.from)}가 보냈어요.</div>`:""}`;
  }
  $("#overlay").innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="선물 열기">${html}</div>`;
  $("#closeBtn").onclick=closeModal;
  const ub=$("#unwrapBtn");
  if(ub) ub.onclick=()=>{ $("#bigGift").classList.add("unwrap"); ub.disabled=true;
    setTimeout(()=>{ unwrapped=true; g.opened=true; renderModal(); }, 750); };
  document.querySelectorAll(".cand:not(:disabled)").forEach(b=>b.onclick=()=>guess(b.dataset.c));
}
function guess(name){
  const g=gifts[cur];
  if(name===g.from){ g.result="right"; }
  else { g.wrongs.push(name); if(g.wrongs.length>=3) g.result="miss"; else toast(`${name}는 아니에요. 단서 하나가 더 열렸어요`); }
  renderModal();
}
$("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&cur>-1) closeModal(); });

$("#tabHost").onclick=()=>{view="host"; renderPanel();};
$("#tabSend").onclick=()=>{view="send"; renderPanel();};

renderTop(); renderGifts(); renderPanel();
</script>

</body>
</html>
