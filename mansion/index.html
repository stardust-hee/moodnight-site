<body>
<style>
/* Layout: 눈 내리는 밤거리의 작은 맨션 한 동(왼쪽) + 관리실 창(오른쪽). 화면, 버튼, 창, 글자까지 모두 32bit 도트 게임 UI.
   모서리는 계단식으로 깎고, 그림자는 흐림 없이 딱 떨어지게. 글꼴은 갈무리(OFL). 겨울밤 단일 테마 */
@font-face{font-family:"Galmuri11";src:url(/mansion/fonts/Galmuri11.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Galmuri11";font-weight:700;src:url(/mansion/fonts/Galmuri11-Bold.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Galmuri14";src:url(/mansion/fonts/Galmuri14.woff2) format("woff2");font-display:swap}
:root{
  color-scheme: dark;
  --night:#0F1B28; --night2:#172738; --night3:#24384C; --edge:#060C14; --snow:#EEF3F8; --snow-soft:#9FB2C6;
  --amber:#FFA347; --amber-d:#C46A1E; --candle:#FFD27A; --ember:#C8553D; --ember-d:#7A2E26; --pine:#5B8C5A;
  --px:"Galmuri11","Apple SD Gothic Neo","Malgun Gothic",monospace;
  --px14:"Galmuri14","Galmuri11","Apple SD Gothic Neo",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--snow)}
body{margin:0;font-family:var(--px);font-size:12px;line-height:1.75;word-break:keep-all;-webkit-font-smoothing:none;font-smooth:never;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:6px 6px}
button,input,textarea{font:inherit;color:inherit;-webkit-font-smoothing:none}
button{cursor:pointer}
:focus-visible{outline:3px dashed var(--candle);outline-offset:3px}
/* 계단식 모서리 상자: box-shadow 테두리 + 딱 떨어지는 그림자 */
.demo-bar,.panel,.sheet,.stat,.res button,.btn,.tabs,.field input[type=text],.field textarea,.chips button,.units button,.toast,.pill,.room,.pv canvas,.shop,.notes,.frame{border-radius:0}
.demo-bar,.panel,.sheet,.frame{box-shadow:0 -3px var(--edge),0 3px var(--edge),-3px 0 var(--edge),3px 0 var(--edge),6px 6px 0 3px rgba(0,0,0,.45)}

.demo-bar{max-width:1074px;margin:3px auto 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--snow-soft);background:var(--night2);padding:8px 12px}
.demo-bar b{color:var(--candle);font-weight:700}
.demo-bar a{color:var(--candle);text-decoration:none;font-weight:700}
.demo-bar .acts{display:flex;gap:8px;flex-wrap:wrap}
.demo-bar .acts button{border:0;background:var(--night);color:var(--snow);padding:3px 10px;box-shadow:0 -2px var(--night3),0 2px var(--night3),-2px 0 var(--night3),2px 0 var(--night3)}
.demo-bar .acts button:hover{color:var(--candle)}
.app{max-width:1074px;margin:0 auto;display:grid;gap:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;background:#2A2230;display:grid;place-items:center;box-shadow:0 -3px var(--edge),0 3px var(--edge),-3px 0 var(--edge),3px 0 var(--edge),inset 0 -4px 0 rgba(0,0,0,.3)}
.brand-mark svg{image-rendering:pixelated}
.brand h1{font-family:var(--px14);font-weight:400;font-size:30px;line-height:1.1;margin:0;color:var(--candle);text-shadow:3px 3px 0 var(--ember-d)}
.brand p{margin:2px 0 0;color:var(--snow-soft)}
.pill{background:var(--night2);color:var(--candle);padding:4px 12px;box-shadow:0 -3px var(--amber-d),0 3px var(--amber-d),-3px 0 var(--amber-d),3px 0 var(--amber-d)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.yard{display:grid;gap:16px;min-width:0}
.frame{position:relative;overflow:hidden;background:#0C1622;aspect-ratio:240/264;max-width:100%;margin:3px}
.frame canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hits{position:absolute;inset:0}
.unit,.spot{position:absolute;border:0;background:none;padding:0}
.unit:hover,.unit:focus-visible,.spot:hover,.spot:focus-visible{outline:3px solid var(--candle);outline-offset:-3px}
.unit .no{position:absolute;left:50%;top:-3px;transform:translate(-50%,-100%);background:var(--edge);color:var(--candle);padding:0 6px;opacity:0;pointer-events:none;white-space:nowrap}
.unit:hover .no,.unit:focus-visible .no{opacity:1}
.unit.new{animation:flash 1.2s steps(6)}
@keyframes flash{0%,50%{outline:4px solid #FFE7B0;outline-offset:-4px;background:rgba(255,231,176,.25)}100%{outline:0}}
.plaque,.boardtag,.b1sign,.campsign,.shopsign,.factsign,.shoptip,.hint-chip{font-family:var(--px);font-size:clamp(9px,1.4vw,12px);line-height:1.5;white-space:nowrap;pointer-events:none;position:absolute}
.plaque{left:50%;bottom:16.4%;transform:translateX(-50%);color:#3A2418;background:#F3D9A4;padding:0 6px;box-shadow:0 -2px #7A4A2A,0 2px #7A4A2A,-2px 0 #7A4A2A,2px 0 #7A4A2A}
.factsign{left:77.6%;top:69.6%;width:21%;text-align:center;color:#FFF4DE;background:#5A3A2A;padding:0 2px;box-shadow:0 -2px #C8423A,0 2px #C8423A,-2px 0 #C8423A,2px 0 #C8423A}
.boardtag{left:58.6%;top:86.2%;color:#3A2418;background:#F3D9A4;padding:0 4px}
.b1sign{left:27.5%;top:73.6%;width:12.5%;text-align:center;color:#FFE3DC;background:#3A1418;padding:0 1px;box-shadow:0 -2px #E0574A,0 2px #E0574A,-2px 0 #E0574A,2px 0 #E0574A;animation:signBlink 1.6s steps(2) infinite}
.campsign{left:81.6%;top:88.6%;color:#3A2418;background:#D9B27A;padding:0 5px 0 4px;box-shadow:0 -2px #7A4A2A,0 2px #7A4A2A,-2px 0 #7A4A2A,2px 0 #7A4A2A;clip-path:polygon(0 -3px,86% -3px,100% 50%,86% calc(100% + 3px),0 calc(100% + 3px))}
.shopsign{left:1.6%;top:69.6%;width:20%;text-align:center;color:#FFF4DE;background:var(--ember);padding:0 2px;box-shadow:0 -2px var(--candle),0 2px var(--candle),-2px 0 var(--candle),2px 0 var(--candle);animation:signBlink 1.2s steps(2) infinite}
@keyframes signBlink{50%{box-shadow:0 -2px #FFF4DE,0 2px #FFF4DE,-2px 0 #FFF4DE,2px 0 #FFF4DE,0 0 0 5px rgba(255,210,122,.35);color:#FFE7A0}}
.shoptip{left:11.6%;top:65.4%;transform:translateX(-50%);color:#2A1608;background:var(--candle);padding:0 5px;animation:bobTip 1s steps(2) infinite}
@keyframes bobTip{50%{transform:translate(-50%,-3px)}}
.hint-chip{left:50%;top:10px;transform:translateX(-50%);background:rgba(6,12,20,.82);color:var(--snow);padding:2px 10px}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.stamp b{font-family:var(--px14);font-weight:400;font-size:18px;color:#2A1608;background:var(--candle);padding:4px 14px;white-space:nowrap;box-shadow:0 -3px var(--edge),0 3px var(--edge),-3px 0 var(--edge),3px 0 var(--edge),6px 6px 0 3px rgba(0,0,0,.5);animation:stamp .45s steps(4) both}
@keyframes stamp{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}

.btn{position:relative;border:0;padding:11px 10px 13px;font-family:var(--px);font-weight:700;font-size:13px;background:var(--amber);color:#2A1608;line-height:1.3;margin:3px;
  box-shadow:0 -3px var(--edge),0 3px var(--edge),-3px 0 var(--edge),3px 0 var(--edge),inset 0 -4px 0 var(--amber-d),inset 0 3px 0 rgba(255,255,255,.35),4px 4px 0 3px rgba(0,0,0,.45)}
.btn:hover{background:#FFB463}
.btn:active{transform:translate(3px,3px);box-shadow:0 -3px var(--edge),0 3px var(--edge),-3px 0 var(--edge),3px 0 var(--edge),inset 0 4px 0 var(--amber-d)}
.btn.ghost{background:var(--night3);color:var(--snow);box-shadow:0 -3px var(--edge),0 3px var(--edge),-3px 0 var(--edge),3px 0 var(--edge),inset 0 -4px 0 #172738,inset 0 3px 0 rgba(255,255,255,.08),4px 4px 0 3px rgba(0,0,0,.45)}
.btn.ghost:hover{background:#2E4660}
.btn.wide{width:calc(100% - 6px);font-size:14px;padding:13px}
.btn:disabled{opacity:.45;cursor:default}
.ctas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctas .board-btn{grid-column:1/-1}
.how{list-style:none;margin:4px 0;padding:0;display:grid;gap:8px}
.how li{position:relative;padding:8px 10px 8px 42px;background:var(--night);color:var(--snow-soft);font-size:12px;line-height:1.6;box-shadow:0 -2px var(--night3),0 2px var(--night3),-2px 0 var(--night3),2px 0 var(--night3);margin:2px}
.how li::before{content:attr(data-i);position:absolute;left:11px;top:8px;font-size:17px;line-height:1.3}
.how li b{display:block;color:var(--candle);font-family:var(--px14);font-weight:400;font-size:14px}

.panel{background:var(--night2);padding:0 16px 16px;display:grid;gap:16px;min-width:0;margin:3px}
.panel::before{content:"관리실.exe";display:block;margin:0 -16px;padding:4px 10px;background:var(--ember);color:#FFF4DE;font-weight:700;box-shadow:inset 0 -3px var(--ember-d);background-image:linear-gradient(90deg,transparent calc(100% - 52px),var(--ember) calc(100% - 52px)),repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.18) 6px 9px)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--edge);padding:3px;gap:3px}
.tabs button{border:0;background:var(--night);padding:7px 6px;color:var(--snow-soft)}
.tabs button[aria-selected="true"]{background:var(--night3);color:var(--candle);box-shadow:inset 0 -3px var(--candle)}
.h2{margin:0;font-family:var(--px14);font-weight:400;font-size:15px;color:var(--candle)}
.h2::before{content:"▶ ";font-size:10px;vertical-align:2px}
.sub{margin:0;color:var(--snow-soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 3px}
.stat{background:var(--night);padding:6px 8px;text-align:center;box-shadow:0 -2px var(--night3),0 2px var(--night3),-2px 0 var(--night3),2px 0 var(--night3)}
.stat b{display:block;font-family:var(--px14);font-weight:400;font-size:24px;color:var(--candle);font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{color:var(--snow-soft)}
.res{list-style:none;margin:0;padding:3px;display:grid;gap:8px;max-height:380px;overflow:auto}
.res button{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:var(--night);border:0;padding:6px 8px;box-shadow:0 -2px var(--night3),0 2px var(--night3),-2px 0 var(--night3),2px 0 var(--night3)}
.res button:hover{box-shadow:0 -2px var(--candle),0 2px var(--candle),-2px 0 var(--candle),2px 0 var(--candle)}
.res .ho{font-weight:700;color:#2A1608;text-align:center;padding:4px 0;background:var(--candle)}
.res .ho.off{color:var(--snow-soft);background:var(--night3)}
.res b{font-weight:700}
.res p{margin:0;color:var(--snow-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lock{display:inline-block;background:var(--night3);color:var(--snow-soft);padding:0 5px;margin-left:5px;font-size:11px}

/* 창(시트) */
.overlay{position:fixed;inset:0;background:rgba(4,8,14,.78);display:grid;place-items:center;z-index:50;padding:max(18px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet{background:var(--night2);width:min(480px,100%);max-height:100%;overflow:auto;animation:rise .25s steps(3)}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.sbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;padding:4px 6px 4px 10px;background:var(--ember);color:#FFF4DE;font-weight:700;box-shadow:inset 0 -3px var(--ember-d)}
.sbar button{margin-left:auto;width:24px;height:22px;border:0;background:#FFF4DE;color:var(--ember-d);font-weight:700;line-height:1;padding:0;box-shadow:inset -2px -2px 0 #C9B79E}
.sbody{padding:14px 16px 18px;display:grid;gap:14px}
.sbody h3{margin:0;font-family:var(--px14);font-weight:400;font-size:15px;color:var(--candle)}
.hint{color:var(--snow-soft);margin:0}
.room{position:relative;aspect-ratio:200/125;box-shadow:0 -3px var(--edge),0 3px var(--edge),-3px 0 var(--edge),3px 0 var(--edge);margin:3px}
.room canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.bubble{position:absolute;left:50%;top:6%;transform:translateX(-50%);max-width:84%;background:#FFF6E6;color:#2A1C14;padding:5px 10px;text-align:center;line-height:1.6;box-shadow:0 -2px #2A1C14,0 2px #2A1C14,-2px 0 #2A1C14,2px 0 #2A1C14}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-4px;width:8px;height:6px;background:#FFF6E6;box-shadow:-2px 0 #2A1C14,2px 0 #2A1C14,0 2px #2A1C14;clip-path:polygon(-4px 0,12px 0,12px 8px,-4px 8px)}
.bubble.locked{background:var(--night3);color:var(--snow-soft)}
.bubble.locked::after{background:var(--night3)}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.who b{font-family:var(--px14);font-weight:400;font-size:15px;color:var(--candle)}
.who span{color:var(--snow-soft)}
.pv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px;align-items:stretch;padding:3px}
.pv canvas{display:block;width:100%;image-rendering:pixelated;box-shadow:0 -2px var(--edge),0 2px var(--edge),-2px 0 var(--edge),2px 0 var(--edge)}
.field{display:grid;gap:8px}
.lbl2{font-weight:700;display:flex;align-items:center;gap:8px}
.lbl2 .n{display:inline-grid;place-items:center;width:18px;height:18px;background:var(--candle);color:#2A1608;font-size:11px;flex:none}
.lbl2 small{font-weight:400;font-size:11px;color:var(--snow-soft)}
.field input[type=text],.field textarea{width:calc(100% - 6px);margin:3px;font-size:16px;font-family:var(--px);color:var(--snow);background:var(--edge);border:0;padding:8px 10px;box-shadow:0 -2px var(--night3),0 2px var(--night3),-2px 0 var(--night3),2px 0 var(--night3)}
@media (min-width:600px){.field input[type=text],.field textarea{font-size:13px}}
.field textarea{resize:vertical;min-height:64px}
.field input:focus,.field textarea:focus{outline:0;box-shadow:0 -2px var(--candle),0 2px var(--candle),-2px 0 var(--candle),2px 0 var(--candle)}
.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--snow-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px}
.chips button{padding:3px 9px;background:var(--night);border:0;color:var(--snow);display:inline-flex;align-items:center;gap:6px;box-shadow:0 -2px var(--night3),0 2px var(--night3),-2px 0 var(--night3),2px 0 var(--night3)}
.chips button[aria-pressed="true"]{background:var(--candle);color:#2A1608;box-shadow:0 -2px var(--edge),0 2px var(--edge),-2px 0 var(--edge),2px 0 var(--edge)}
.chips i{width:10px;height:10px;display:inline-block;box-shadow:0 0 0 1px var(--edge)}
.units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:2px}
.units button{padding:4px;background:var(--night);border:0;color:var(--snow);font-weight:700;box-shadow:0 -2px var(--night3),0 2px var(--night3),-2px 0 var(--night3),2px 0 var(--night3)}
.units button[aria-pressed="true"]{background:var(--candle);color:#2A1608}
.units button[aria-pressed="true"] small{color:#5A3A1A}
.units button:disabled{opacity:.35;cursor:default}
.units button small{display:block;font-weight:400;font-size:11px;color:var(--snow-soft)}
.err{margin:0;color:#FF9C8A;min-height:1em}
.evict{display:grid;gap:8px;padding:10px 12px;background:#2A1414;box-shadow:0 -2px #7A2E26,0 2px #7A2E26,-2px 0 #7A2E26,2px 0 #7A2E26;margin:2px}
.evict p{margin:0;color:#F3C9C0}
.evict .row{display:flex;gap:8px;flex-wrap:wrap}
.btn.danger{background:var(--ember);color:#FFF4DE;box-shadow:0 -3px var(--edge),0 3px var(--edge),-3px 0 var(--edge),3px 0 var(--edge),inset 0 -4px 0 var(--ember-d),inset 0 3px 0 rgba(255,255,255,.2),4px 4px 0 3px rgba(0,0,0,.45)}
.btn.danger:hover{background:#D86650}
.btn.sm{font-size:12px;padding:7px 10px 9px}
.note .rm{position:absolute;top:2px;right:2px;border:0;background:#2A1C14;color:#FFF4DE;font-size:10px;line-height:1;padding:2px 4px;cursor:pointer}
.shot{width:100%;display:block;image-rendering:pixelated}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;padding:14px;background:#8A6A4A;box-shadow:0 -3px #5C3E2A,0 3px #5C3E2A,-3px 0 #5C3E2A,3px 0 #5C3E2A,inset 0 0 0 3px #A78560;margin:3px;
  background-image:radial-gradient(#7A5A3C 1px,transparent 1.5px);background-size:6px 6px}
.note{position:relative;padding:12px 9px 8px;color:#2A1C14;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.note::before{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;background:#C8423A;box-shadow:0 0 0 1px #6A1E18}
.note b{display:block;font-weight:400;font-size:11px;color:#7A5A44;margin-top:4px;text-align:right}
.note.new{animation:stamp .45s steps(4) both}
