let inRoot=null, inItems=null, inOwner=null, inOwnerType=null;
// 동물의 숲처럼 정면에서 들어가 보는 방: 네모난 바닥 + 텐트 모양 뒷벽 + 낮게 자른 옆벽 + 입구 매트
const ROOM={W:3.4,D:6.2,cut:1.45};
function profile(type){ const W=ROOM.W;
  if(type==='aframe') return {H:4.5,f:y=>W*(1-y/4.5)};
  if(type==='dome') return {H:3.9,f:y=>W*Math.sqrt(Math.max(0,1-(y/3.9)**2))};
  return {H:4.7,f:y=>y<1.7?W:W*(1-(y-1.7)/3.0)}; }
function buildInside(data, editable){
  if(inRoot) inside.remove(inRoot);
  inRoot=new THREE.Group(); inside.add(inRoot); inOwner=editable; inOwnerType=data.type;
  const {W,D,cut}=ROOM, {H,f}=profile(data.type), Z=D/2;
  const base=mesh(new THREE.BoxGeometry(2*W+.4,.5,D+.3),PAL.soil); base.position.y=-.25; inRoot.add(base);
  for(let i=-3;i<=3;i++){ const plank=mesh(new THREE.BoxGeometry(.97,.08,D),i%2?PAL.woodL:0xb88d62); plank.position.set(i*.97,.04,0); plank.castShadow=false; inRoot.add(plank); }
  const mat=new THREE.MeshStandardMaterial({color:data.color,flatShading:true,roughness:.95,side:THREE.DoubleSide});
  const dark=new THREE.MeshStandardMaterial({color:new THREE.Color(data.color).multiplyScalar(.82),flatShading:true,roughness:.95,side:THREE.DoubleSide});
  // 뒷벽: 텐트 단면 모양 그대로
  const N=24, pts=[]; for(let i=0;i<=N;i++){ const y=H*i/N; pts.push([f(y),y]); }
  const sh=new THREE.Shape(); sh.moveTo(-W,0); sh.lineTo(W,0); pts.forEach(([x,y])=>sh.lineTo(x,y)); pts.slice().reverse().forEach(([x,y])=>sh.lineTo(-x,y));
  const back=new THREE.Mesh(new THREE.ShapeGeometry(sh),mat); back.position.z=-Z+.01; back.receiveShadow=true; inRoot.add(back);
  // 옆벽: 같은 단면을 cut 높이까지만 앞쪽으로 늘려요
  const sideGeo=sgn=>{ const v=[], M=8; for(let i=0;i<M;i++){ const y0=cut*i/M, y1=cut*(i+1)/M, x0=sgn*f(y0), x1=sgn*f(y1);
      v.push(x0,y0,-Z, x1,y1,-Z, x1,y1,Z,  x0,y0,-Z, x1,y1,Z, x0,y0,Z); }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(v,3)); g.computeVertexNormals(); return g; };
  if(data.type!=='aframe') [-1,1].forEach(sg=>{ const w=new THREE.Mesh(sideGeo(sg),dark); w.receiveShadow=true; inRoot.add(w);
    const trim=mesh(new THREE.BoxGeometry(.12,.1,D),PAL.wood); trim.position.set(sg*f(cut),cut,0); inRoot.add(trim); });
  // 뒷벽 테두리 나무 프레임
  for(let i=0;i<N;i++){ [-1,1].forEach(sg=>{ const A=new THREE.Vector3(sg*pts[i][0],pts[i][1],-Z+.05), B=new THREE.Vector3(sg*pts[i+1][0],pts[i+1][1],-Z+.05);
    const len=A.distanceTo(B); if(len<.01) return; const m=mesh(new THREE.CylinderGeometry(.06,.06,len,5),PAL.wood); m.position.copy(A).add(B).multiplyScalar(.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.sub(A).normalize()); inRoot.add(m); }); }
  // 입구 매트
  const mat2=mesh(new THREE.BoxGeometry(1.7,.05,1.5),0xc9b48e); mat2.position.set(0,-.02,Z+.75); mat2.castShadow=false; inRoot.add(mat2);
  // 꼬마전구: 뒷벽을 가로질러 늘어지게
  const bulbs=new THREE.Group(), by=Math.min(H-.9,2.9), bw=f(by)*.92;
  for(let i=0;i<13;i++){ const t=i/12; const b=new THREE.Mesh(new THREE.SphereGeometry(.07,6,4),new THREE.MeshStandardMaterial({color:0xfff2c4,emissive:0xffd27a,emissiveIntensity:1.6}));
    b.position.set(-bw+2*bw*t,by-Math.sin(t*Math.PI)*.45,-Z+.15); bulbs.add(b); } inRoot.add(bulbs);
  inItems=new THREE.Group(); inRoot.add(inItems);
  (data.in||[]).forEach(([t,x,z,r])=>{ const p=makeProp(t); const c=clampRoom(x,z); p.position.set(c[0],.08,c[1]); p.rotation.y=r||0; p.userData.item=true; inItems.add(p); });
  const warm=new THREE.PointLight(0xffd29a,18,10,1.6); warm.position.set(0,2.6,.4); inRoot.add(warm);
}

function itemUnder(e){ const g=editGroup(); if(!g) return null; setNdc(e); const hits=ray.intersectObjects(g.children,true); if(!hits.length) return null; let o=hits[0].object; while(o.parent&&o.parent!==g) o=o.parent; return o; }
function groundPoint(e,y){ setNdc(e); const p=new THREE.Vector3(); return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-y),p)?p:null; }
cv.addEventListener('pointerdown',e=>{
  down={x:e.clientX,y:e.clientY,t:performance.now()};

});
cv.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const g=editGroup(); const root=mode==='admin'?common:mode==='outside'?siteObjs[curSite].root:inRoot;
  const y=mode==='admin'?Y0:mode==='outside'?Y0+.1:.08; const p=groundPoint(e,y); if(!p) return;
  if(mode==='admin'){ const l=common.worldToLocal(p.clone()); dragging.position.x=Math.max(-20,Math.min(20,l.x)); dragging.position.z=Math.max(-15,Math.min(15,l.z)); return; }
  const local=root.worldToLocal(p.clone()); const {R,core}=areaInfo();
  if(mode!=='outside'){ const c=clampRoom(local.x,local.z); dragging.position.x=c[0]; dragging.position.z=c[1]; return; }
  let len=Math.hypot(local.x,local.z); if(len>R){ local.x*=R/len; local.z*=R/len; len=R; }
  if(core && len<core){ const k=core/Math.max(len,.001); local.x*=k; local.z*=k; }
  dragging.position.x=local.x; dragging.position.z=local.z;
});
cv.addEventListener('pointerup',e=>{
  const moved=down?Math.hypot(e.clientX-down.x,e.clientY-down.y):99;

function tap(e){
  if(mode==='admin'){ select(null); return; }

  setNdc(e); if(mode!=='outside'&&boardHit&&ray.intersectObject(boardHit,false).length){ Board.open(); return; }
  if(mode==='world'&&ray.intersectObjects(wayHits,false).length){ openWay(ray.intersectObjects(wayHits,false)[0].object.userData.way); return; }
  if(mode!=='outside'&&fireHit&&ray.intersectObject(fireHit,false).length){ Marsh.open(); return; }
  const hits=ray.intersectObjects(hitMeshes,false); if(!hits.length) return;

  if(mode==='outside' && me) { toast('한 계정에 텐트는 한 자리예요'); }

function bandTarget(x,y,z,zoom,sheetH){
  const top=64, bottom=innerHeight-sheetH, yDes=(top+bottom)/2, dpx=yDes-innerHeight/2;
  const upp=(camera.top-camera.bottom)/zoom/innerHeight;
  camera.updateMatrixWorld(); const up=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
  const T=new THREE.Vector3(x,y,z).addScaledVector(up,dpx*upp);
  const d=new THREE.Vector3(); camera.getWorldDirection(d); const k=(y-T.y)/d.y; return T.addScaledVector(d,k);
}
function sheetGuess(){ return Math.min(innerHeight*.5, 300); }
function focus(x,z,zoom,sheetH){ const to=bandTarget(x,Y0+.6,z,zoom,sheetH==null?sheetGuess():sheetH); tween={from:controls.target.clone(),to,z0:camera.zoom,z1:zoom,t:0}; }
function ensureVisible(o){
  const p=o.getWorldPosition(new THREE.Vector3()); const v=p.clone().project(camera); const sy=(1-v.y)/2*innerHeight, sx=(v.x+1)/2*innerWidth;
  const r=card.getBoundingClientRect(); const limit=Math.min(r.top,innerHeight)-80;
  if(sy>limit||sy<90||sx<30||sx>innerWidth-30){ const to=bandTarget(p.x,p.y,p.z,camera.zoom,innerHeight-r.top+70); tween={from:controls.target.clone(),to,z0:camera.zoom,z1:camera.zoom,t:0}; }
}

const clock=new THREE.Clock();
const lightPool=[0,1,2,3,4].map(()=>{ const l=new THREE.PointLight(0xffb060,0,7,1.6); world.add(l); return l; }); let poolT=0; const _gp=new THREE.Vector3();
function rootOf(o){ while(o.parent) o=o.parent; return o; }
function updateGlows(t){ const k=nightK, inT=scene===inside;
  for(const g of glows){ const fl=g.kind==='fire'?(.82+Math.sin(t*9+g.seed)*.1+Math.sin(t*23+g.seed*3)*.08):(.95+Math.sin(t*2+g.seed)*.05);
    const kk=inT&&rootOf(g.sp)===inside?Math.max(.45,k):k; g.sp.material.opacity=Math.min(1,kk*(g.kind==='fire'?.85:.7))*fl; g.sp.visible=kk>.02; g.sp.scale.setScalar(g.size*(.85+.25*fl)*(.6+.4*kk)); }
  if(t-poolT>.25){ poolT=t; const tg=controls.target; const list=[];
    if(k>.05) for(const g of glows){ if(rootOf(g.sp)!==world) continue; g.sp.getWorldPosition(_gp); list.push({p:_gp.clone(),g,d:Math.hypot(_gp.x-tg.x,_gp.z-tg.z)}); }
    list.sort((a,b)=>a.d-b.d); lightPool.forEach((l,i)=>{ const it=list[i]; if(it){ l.position.copy(it.p); l.position.y+=.4; l.color.setHex(it.g.color); l.userData.base=(it.g.kind==='fire'?9:5)*k; l.userData.fire=it.g.kind==='fire'; l.userData.seed=it.g.seed; } else l.userData.base=0; }); }
  lightPool.forEach(l=>{ const b=l.userData.base||0; l.intensity=b*(l.userData.fire?(.8+Math.sin(t*11+l.userData.seed)*.12+Math.sin(t*27)*.08):1); });
}
function loop(){
  const dt=Math.min(.05,clock.getDelta()), t=clock.elapsedTime;
  if(tween){ tween.t=Math.min(1,tween.t+dt*1.8); const k=1-Math.pow(1-tween.t,3); const prev=controls.target.clone(); controls.target.lerpVectors(tween.from,tween.to,k); camera.position.add(controls.target.clone().sub(prev)); camera.zoom=tween.z0+(tween.z1-tween.z0)*k; camera.updateProjectionMatrix(); if(tween.t>=1) tween=null; }
  if(window.__sky) window.__sky.tick(dt);

  if(marker.parent){ marker.userData.arrow.position.y=marker.userData.top+Math.sin(t*5)*.12; marker.userData.arrow.rotation.y=t*2; marker.userData.ring.material.opacity=.65+.3*Math.sin(t*5); }
  if(fireArrow){ fireArrow.position.y=3.4+Math.abs(Math.sin(t*3+1))*.4; fireArrow.children[0].rotation.y=t*1.5; }
  if(boardArrow){ boardArrow.position.y=3.6+Math.abs(Math.sin(t*3))*.45; boardArrow.children[0].rotation.y=t*1.5; }
  fires.forEach((f,i)=>{ f.scale.y=1+Math.sin(t*12+i)*.12; f.scale.x=f.scale.z=1+Math.cos(t*9+i)*.06; });
  Object.values(siteObjs).forEach(s=>{ const p=s.root.userData.pulse; if(p){ const k=1+Math.sin(t*3)*.08; p[0].scale.set(k,k,k); p[1].position.y=.9+Math.sin(t*3)*.12; } });

  controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop);

/* ================= 하늘: 서울 시간 낮밤 + 기상청 날씨 =================
   미리보기: ?w=rain|snow|cloudy|overcast|clear&h=21 */
const Sky=(()=>{
  const q=new URLSearchParams(location.search), fakeW=q.get('w'), fakeH=q.get('h')!=null?+q.get('h'):null;
  let wx=fakeW?{kind:fakeW,temp:null,place:'서울'}:null;
  const C=h=>new THREE.Color(h);
  // 시간별 하늘 [시각, 배경, 하늘빛, 땅빛, 반구광, 햇빛색, 햇빛]
  const K=[[0,'#2c3550','#6b7bb0','#2f3a32',.55,'#9fb2ff',.25],[5,'#3a4262','#7a86b8','#3a4436',.6,'#a8b4ff',.3],[6.5,'#f3d2b8','#ffd9b8','#8a7a5a',1.0,'#ffc890',1.2],
    [8,'#dfe8d6','#f4f7ff','#7f9a6a',1.25,'#fff3dc',2.2],[16.5,'#dfe8d6','#f4f7ff','#7f9a6a',1.25,'#fff3dc',2.2],[18,'#f0c9a8','#ffcfa0','#7a6a50',1.0,'#ffae70',1.3],
    [19.5,'#4a4870','#8a86c0','#3a4036',.65,'#b0a0ff',.4],[24,'#2c3550','#6b7bb0','#2f3a32',.55,'#9fb2ff',.25]];
  const hourNow=()=>{ if(fakeH!=null) return fakeH; const d=new Date(Date.now()+9*3600e3); return d.getUTCHours()+d.getUTCMinutes()/60; };
  const plazaLight=new THREE.PointLight(0xffa050,0,16,1.5); plazaLight.position.set(CENTER.x+1,Y0+1.6,CENTER.z+.6); world.add(plazaLight);
  // 비·눈 입자
  const N=1400, box={x:46,y:22,z:38}, pos=new Float32Array(N*6), vel=new Float32Array(N);
  for(let i=0;i<N;i++){ const x=rnd(-box.x/2,box.x/2)+CENTER.x, y=rnd(0,box.y), z=rnd(-box.z/2,box.z/2)+CENTER.z; pos.set([x,y,z,x,y-.5,z],i*6); vel[i]=rnd(.8,1.2); }
  const rainGeo=new THREE.BufferGeometry(); rainGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const rain=new THREE.LineSegments(rainGeo,new THREE.LineBasicMaterial({color:0xe6f0fa,transparent:true,opacity:.8})); rain.visible=false; rain.frustumCulled=false; world.add(rain);
  const spos=new Float32Array(N*3); for(let i=0;i<N;i++) spos.set([rnd(-box.x/2,box.x/2)+CENTER.x,rnd(0,box.y),rnd(-box.z/2,box.z/2)+CENTER.z],i*3);
  const snowGeo=new THREE.BufferGeometry(); snowGeo.setAttribute('position',new THREE.BufferAttribute(spos,3));
  const dot=document.createElement('canvas'); dot.width=dot.height=32; { const x=dot.getContext('2d'); const g=x.createRadialGradient(16,16,0,16,16,16); g.addColorStop(0,'#fff'); g.addColorStop(.6,'#ffffffcc'); g.addColorStop(1,'#fff0'); x.fillStyle=g; x.fillRect(0,0,32,32); }
  const snow=new THREE.Points(snowGeo,new THREE.PointsMaterial({size:1.1,map:new THREE.CanvasTexture(dot),transparent:true,depthWrite:false})); snow.visible=false; snow.frustumCulled=false; world.add(snow);
  const tmpA=new THREE.Color(), tmpB=new THREE.Color();
  function sample(h){ let i=0; while(i<K.length-2&&h>=K[i+1][0]) i++; const a=K[i], b=K[i+1], t=(h-a[0])/(b[0]-a[0]);
    const mix=(x,y)=>tmpA.set(x).clone().lerp(tmpB.set(y),t); return {bg:mix(a[1],b[1]),sky:mix(a[2],b[2]),gnd:mix(a[3],b[3]),hi:a[4]+(b[4]-a[4])*t,sc:mix(a[5],b[5]),si:a[6]+(b[6]-a[6])*t}; }
  function apply(){ const h=hourNow(), S=sample(h), k=wx&&wx.kind, gray=C('#9aa3a8');
    const dim=k==='rain'||k==='sleet'?.55:k==='snow'?.35:k==='overcast'?.45:k==='cloudy'?.22:0;
    S.bg.lerp(k==='snow'?C('#dfe4ea'):gray,dim); S.sky.lerp(gray,dim*.6);

    const ico=k==='rain'?'🌧️':k==='sleet'?'🌨️':k==='snow'?'❄️':k==='overcast'?'☁️':k==='cloudy'?'⛅':(h<6||h>=19?'🌙':'☀️');
    const name={rain:'비',sleet:'진눈깨비',snow:'눈',overcast:'흐림',cloudy:'구름 많음',clear:'맑음'}[k]||'';
    $('wx').hidden=false; $('wx').textContent=`${ico} 서울 ${name}${wx&&wx.temp!=null?` ${Math.round(wx.temp)}°`:''}`; }
  function tick(dt){ if(rain.visible){ const a=rainGeo.attributes.position.array; for(let i=0;i<N;i++){ const o=i*6; let y=a[o+1]-dt*22*vel[i]; if(y<Y0){ y=box.y; } a[o+1]=y; a[o+4]=y-.55; a[o+3]=a[o]-.05; } rainGeo.attributes.position.needsUpdate=true; }
    if(snow.visible){ const a=snowGeo.attributes.position.array, t=performance.now()/1000; for(let i=0;i<N;i++){ const o=i*3; let y=a[o+1]-dt*1.6*vel[i]; if(y<Y0) y=box.y; a[o+1]=y; a[o]+=Math.sin(t+i)*dt*.25; } snowGeo.attributes.position.needsUpdate=true; } }
  async function load(){ if(fakeW){ apply(); return; } try{ const r=await fetch('https://gbmlkyfguktjtroczqfw.supabase.co/functions/v1/camp-weather',{headers:{apikey:'sb_publishable_RO92ntdlSM5_Urctc5FD9w_4OHcZQzf'}}); const d=await r.json(); if(d&&d.kind) wx=d; }catch(e){} apply(); }

  $('bPost').onclick=async()=>{ const body=$('bText').value.trim(); if(!body){ toast('쪽지 내용을 적어 주세요'); return; }
    const btn=$('bPost'); btn.disabled=true;
    const {data,error}=await sb.rpc('camp_note_add',{p_camp:campNo,p_body:body,p_photo:$('bPhoto').checked&&photo?photo:null,p_paper:paper,p_name:(user.user_metadata&&(user.user_metadata.name||user.user_metadata.full_name))||''});
    btn.disabled=false; if(error){ toast(errMsg(error)); return; } notes=data||[]; render(); $('bComp').hidden=true; $('bFoot').hidden=false; toast('쪽지를 붙였어요 📌'); track('act','camp_note'); };
  return {open};
})();
/* ================= 마시멜로 굽기 ================= */
const Marsh=(()=>{
  const ROUND=40, LO=.6, HI=.82, STOPS=[[0,[255,250,240]],[.55,[240,201,138]],[.72,[217,160,90]],[.86,[138,90,48]],[1,[42,28,20]]];
  let raf=0, t0=0, last=0, r=0, speed=.35, holding=false, count=0, locked=false, running=false, flareSeed=0;
  const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const col=v=>{ let i=0; while(i<STOPS.length-2&&v>STOPS[i+1][0]) i++; const [a,ca]=STOPS[i],[b,cb]=STOPS[i+1], k=Math.max(0,Math.min(1,(v-a)/(b-a))); return `rgb(${ca.map((x,j)=>Math.round(x+(cb[j]-x)*k)).join(',')})`; };
  const show=id=>['mIntro','mPlay','mEnd'].forEach(k=>$(k).hidden=k!==id);
  const say=(m)=>{ $('mMsg').textContent=m; clearTimeout(say.t); say.t=setTimeout(()=>$('mMsg').textContent='',900); };
  function fresh(){ r=0; speed=rnd(.3,.5); locked=false; const m=$('mM'); m.className='mm'; m.style.background=col(0); $('mNeedle').style.left='0%'; }
  function finish(ok){ locked=true; holding=false; $('mStick').classList.remove('down'); $('mHold').classList.remove('on'); const m=$('mM');
    if(ok){ count++; $('mCount').textContent=count; m.classList.add('pop'); say(['노릇노릇! 🍡','완벽해요!','맛있겠다!'][count%3]); } else { m.classList.add('burn'); m.style.background=col(1); say('앗, 탔어요 💨'); }
    setTimeout(()=>{ if(running) fresh(); },550); }
  function down(e){ e.preventDefault(); if(!running||locked) return; holding=true; $('mStick').classList.add('down'); $('mHold').classList.add('on'); }
  function up(){ if(!running||locked||!holding) return; holding=false; $('mStick').classList.remove('down'); $('mHold').classList.remove('on');
    if(r>=LO&&r<=HI) finish(true); else if(r>HI) finish(false); else say('아직 덜 익었어요'); }
  function frame(now){ if(!running) return; const dt=Math.min(.05,(now-last)/1000); last=now; const el=(now-t0)/1000, left=Math.max(0,ROUND-el);
    $('mTime').textContent=Math.ceil(left);
    const flare=1+.45*Math.sin(el*2.3+flareSeed)+.3*Math.sin(el*5.1+flareSeed*2); $('mFire').style.transform=`translateX(-50%) scale(${(.8+flare*.35).toFixed(2)})`;
    if(holding&&!locked){ r=Math.min(1,r+dt*speed*Math.max(.45,flare)); $('mM').style.background=col(r); $('mNeedle').style.left=(r*100)+'%'; if(r>=1) finish(false); }
    if(left<=0){ end(); return; } raf=requestAnimationFrame(frame); }
  function start(){ show('mPlay'); count=0; $('mCount').textContent='0'; running=true; flareSeed=Math.random()*10; fresh(); t0=last=performance.now(); raf=requestAnimationFrame(frame); track('act','camp_marsh'); }
  function rankHTML(d){ const top=(d&&d.top)||[]; if(!top.length) return '<div><span>아직 기록이 없어요. 첫 번째로 구워 보세요!</span></div>';
    const medal=['🥇','🥈','🥉']; let h=top.map((x,i)=>`<div class="${x.mine?'me':''}"><i>${medal[i]||i+1}</i><span>${esc(x.name)}</span><b>${x.total}개</b><small>최고 ${x.best}</small></div>`).join('');
    if(d.me&&!top.some(x=>x.mine)) h+=`<div class="me"><i>${d.me.rank}</i><span>나</span><b>${d.me.total}개</b><small>최고 ${d.me.best}</small></div>`; return h; }
  async function end(){ running=false; holding=false; cancelAnimationFrame(raf); show('mEnd'); $('mRank').innerHTML='<div><span>랭킹 불러오는 중…</span></div>';
    let note='', d=null;
    if(user&&count>0){ const r=await sb.rpc('camp_marsh_add',{p_count:count,p_name:(user.user_metadata&&(user.user_metadata.name||user.user_metadata.full_name))||''}); if(r.error) note=`<br><small>기록하지 못했어요: ${esc(errMsg(r.error))}</small>`; else d=r.data; }
    else if(!user) note='<br><small>로그인하면 랭킹에 기록돼요</small>';
    if(!d){ const r=await sb.rpc('camp_marsh_top'); d=r.data; }
    $('mRes').innerHTML=`이번 판 <b>${count}개</b> 구웠어요!${d&&d.me?`<br>지금까지 모두 ${d.me.total}개 · ${d.me.rank}등`:''}${note}`; $('mRank').innerHTML=rankHTML(d); }
  async function ranking(){ show('mEnd'); $('mRes').innerHTML='🏆 <b>마시멜로 랭킹</b><br><small>지금까지 구운 개수 순서예요</small>'; $('mRank').innerHTML='<div><span>불러오는 중…</span></div>'; const r=await sb.rpc('camp_marsh_top'); $('mRank').innerHTML=rankHTML(r.data); }
  function close(){ running=false; cancelAnimationFrame(raf); $('marsh').hidden=true; }
  ['mHold','mStage'].forEach(id=>{ $(id).addEventListener('pointerdown',down); });
  addEventListener('pointerup',up); addEventListener('pointercancel',up);
  $('mStart').onclick=start; $('mAgain').onclick=start; $('mRankBtn').onclick=ranking; $('mBack').onclick=close; $('mClose').onclick=close;
  $('marsh').onclick=e=>{ if(e.target.id==='marsh'&&!running) close(); };
  return {open(){ show('mIntro'); $('marsh').hidden=false; }};
})();
/* ================= 소리 =================
   '캠핑 시작하기'를 눌러야 재생돼요(브라우저 자동재생 제한).
   음악: 캠핑장=Campfire, 꾸미기·텐트 안=Mellow Moments (HTMLAudio → Web Audio 게인으로 크로스페이드)
   모닥불: 디코딩한 버퍼를 이음매 크로스페이드로 다시 만들어 AudioBufferSource.loop로 끊김 없이 반복.
           보이는 모닥불 중 가까운 4개에 목소리를 하나씩 붙이고, 카메라가 보는 지점과의 거리·줌으로 크기, 화면 좌우 위치로 팬을 정해요 */
const Sound=(()=>{
  let ctx=null, started=false, cur=null, fireBuf=null, master, musicBus, fireBus; const tr={}, voices=[];
  const cfg={on:true,music:70,fire:80}; try{ Object.assign(cfg,JSON.parse(localStorage.getItem('mlc-audio')||'{}')); }catch(e){}
  const store=()=>{ try{ localStorage.setItem('mlc-audio',JSON.stringify(cfg)); }catch(e){} };
  const SRC={campfire:'bgm/campfire.mp3',mellow:'bgm/mellow.mp3'}, MUSIC_MAX=.3, FIRE_MAX=.9;
  function mk(k){ const a=new Audio(SRC[k]); a.loop=true; a.preload='auto';
    const g=ctx.createGain(); g.gain.value=0; ctx.createMediaElementSource(a).connect(g).connect(musicBus); tr[k]={a,g}; }
  function fade(k,to,sec){ const t=tr[k]; const now=ctx.currentTime; t.g.gain.cancelScheduledValues(now); t.g.gain.setValueAtTime(t.g.gain.value,now); t.g.gain.linearRampToValueAtTime(to,now+sec);
    if(to>0) t.a.play().catch(()=>{}); else { clearTimeout(t.st); t.st=setTimeout(()=>{ if(t.g.gain.value<0.001) t.a.pause(); },sec*1000+150); } }
  const want=()=>(mode==='outside'||mode==='inside'||mode==='visitIn')?'mellow':'campfire';
  function applyMusic(){ if(!started) return; const w=cfg.on?want():null; ['campfire','mellow'].forEach(k=>fade(k,k===w?1:0,1.6)); cur=w; }
  function applyBus(){ if(!started) return; const n=ctx.currentTime;
    master.gain.setTargetAtTime(cfg.on?1:0,n,.15); musicBus.gain.setTargetAtTime(MUSIC_MAX*(cfg.music/100)**1.5,n,.1); fireBus.gain.setTargetAtTime(FIRE_MAX*(cfg.fire/100)**1.5,n,.1); }
  // 이음매: 끝 F샘플을 처음 F샘플에 동일전력 크로스페이드로 겹치고, 인코더가 넣은 앞뒤 무음은 잘라요
  function seamless(buf){ const d=buf.getChannelData(0); let a=0,b=d.length-1; while(a<b&&Math.abs(d[a])<1e-4) a++; while(b>a&&Math.abs(d[b])<1e-4) b--;
    const n=b-a+1, F=Math.min(Math.floor(buf.sampleRate*1.5),Math.floor(n/4)), L=n-F, out=ctx.createBuffer(1,L,buf.sampleRate), o=out.getChannelData(0);
    for(let i=0;i<L;i++) o[i]=d[a+i]; for(let i=0;i<F;i++){ const x=i/F; o[i]=d[a+i]*Math.sin(x*Math.PI/2)+d[a+L+i]*Math.cos(x*Math.PI/2); } return out; }
  async function loadFire(){ try{ const r=await fetch('bgm/fire-loop.mp3'); fireBuf=seamless(await ctx.decodeAudioData(await r.arrayBuffer()));
    for(let i=0;i<4;i++){ const src=ctx.createBufferSource(); src.buffer=fireBuf; src.loop=true; const g=ctx.createGain(); g.gain.value=0;
      const pan=ctx.createStereoPanner?ctx.createStereoPanner():null; src.connect(g); if(pan){ g.connect(pan).connect(fireBus); } else g.connect(fireBus);
      src.playbackRate.value=1+(i-1.5)*.03; src.start(0,(i*fireBuf.duration/4)%fireBuf.duration); voices.push({g,pan}); } }catch(e){} }
  let rainG=null, rainLv=0;
  function rainNode(){ const len=ctx.sampleRate*2, b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0); let l=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; l=l*.6+w*.4; d[i]=l; }
    for(let i=0;i<2048;i++){ const x=i/2048; d[i]=d[i]*x+d[len-2048+i]*(1-x); } // 이음매 부드럽게
    const src=ctx.createBufferSource(); src.buffer=b; src.loop=true; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400; const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=380;
    rainG=ctx.createGain(); rainG.gain.value=0; src.connect(hp).connect(lp).connect(rainG).connect(fireBus); src.start(); }
  function setRain(v){ rainLv=v; if(!started) return; if(!rainG) rainNode(); const inT=mode==='inside'||mode==='visitIn'; rainG.gain.setTargetAtTime(v*(inT?.32:.22),ctx.currentTime,.8); }
  const tmp=new THREE.Vector3();
  function inScene(o){ let p=o; while(p.parent) p=p.parent; return p===scene; }
  function updateFires(){ if(!voices.length) return; const lis=controls.target, z=Math.sqrt(camera.zoom); const list=[];
    for(let i=0;i<fires.length;i+=2){ const f=fires[i]; if(!inScene(f)) continue; f.getWorldPosition(tmp);
      const big=!!(f.parent&&f.parent.userData.big); const d=Math.hypot(tmp.x-lis.x,tmp.z-lis.z)*(1.6/(z+.6));
      const g=Math.max(0,1-Math.max(0,d-(big?2.5:1.2))/(big?16:10))**2*(big?1:.75); if(g<=0) continue;
      const v=tmp.clone().project(camera); list.push({g,pan:Math.max(-.8,Math.min(.8,v.x*.8))}); }
    list.sort((a,b)=>b.g-a.g); const n=ctx.currentTime;
    voices.forEach((vc,i)=>{ const it=list[i]; vc.g.gain.setTargetAtTime(it?it.g:0,n,.25); if(vc.pan) vc.pan.pan.setTargetAtTime(it?it.pan:0,n,.25); }); }
  function start(){ if(started) return; try{ ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.connect(ctx.destination); musicBus=ctx.createGain(); fireBus=ctx.createGain(); musicBus.connect(master); fireBus.connect(master);
    ['campfire','mellow'].forEach(mk); started=true; ctx.resume&&ctx.resume(); applyBus(); applyMusic(); loadFire(); if(rainLv) setRain(rainLv); }catch(e){} }
  function ui(){ $('snd').textContent=cfg.on?'🔊':'🔇'; $('vMusic').value=cfg.music; $('vFire').value=cfg.fire; $('vMute').textContent=cfg.on?'소리 끄기':'소리 켜기'; }
  $('snd').onclick=e=>{ e.stopPropagation(); $('vol').hidden=!$('vol').hidden; };
  $('vMusic').oninput=e=>{ cfg.music=+e.target.value; store(); applyBus(); };
  $('vFire').oninput=e=>{ cfg.fire=+e.target.value; store(); applyBus(); };
  $('vMute').onclick=()=>{ cfg.on=!cfg.on; store(); ui(); if(cfg.on) start(); applyBus(); applyMusic(); };
  addEventListener('pointerdown',e=>{ if(!$('vol').hidden&&!e.target.closest('#vol,#snd')) $('vol').hidden=true; },true);
  $('startCamp').onclick=()=>{ $('intro').classList.add('hide'); setTimeout(()=>$('intro').hidden=true,550); if(cfg.on) start(); };
  document.addEventListener('visibilitychange',()=>{ if(!started) return; if(document.hidden) ctx.suspend(); else ctx.resume(); });
  setInterval(()=>{ if(!started) return; if(cfg.on&&want()!==cur) applyMusic(); updateFires(); if(rainLv) setRain(rainLv); },120);
  ui(); return {start,setRain};
})();
(async()=>{
  const q=new URLSearchParams(location.search); const qc=parseInt(q.get('c'))||null, qs=parseInt(q.get('s'))||null;
  const {data}=await sb.auth.getSession(); user=data.session?data.session.user:null;
  if(location.hash.includes('access_token')) history.replaceState(null,'',location.pathname+location.search);
  sb.auth.onAuthStateChange((ev,ss)=>{ user=ss?ss.user:null; });
  let after=null; try{ after=JSON.parse(sessionStorage.getItem('mlc-after')||'null'); sessionStorage.removeItem('mlc-after'); }catch(e){}
  await loadCamp(after&&user?after.camp:qc); buildAll();
  try{ const {data:w}=await sb.rpc('camp_world_get'); if(w){ isAdmin=!!w.admin; if(Array.isArray(w.items)&&w.items.length) buildCommon(w.items); } }catch(e){}
  if(after&&user&&!isTaken(after.site)){ pick.type=after.type; pick.color=after.color;
    const nm=user.user_metadata&&(user.user_metadata.name||user.user_metadata.full_name); if(!pick.name&&nm) pick.name=String(nm).slice(0,10);
    showPlaceCard(after.site); return; }
  if(qs&&NEIGHBORS[qs]){ showWorldCard(); setTimeout(()=>visitOutside(qs),300); return; }
  showWorldCard();
})();

window.__camp={Marsh,marker,get selected(){return selected},get mode(){return mode},get me(){return me},SITES,enterOutside,addItem,enterInside,showPlaceCard,camera,controls,visitOutside};
