<script type="module">
const fires=[];
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 기본 ================= */
const $=id=>document.getElementById(id);
const cv=$('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;

const PAL={grass:0xa9c784,grass2:0x9dbd78,soil:0xa57c55,soilD:0x84603f,sand:0xe8d9b5,stone:0xd9cdb4,water:0x86c9d1,waterD:0x6fb3be,rock:0xbfb6a6,rockD:0x9e968a,pine:0x5e8b5c,pine2:0x6f9d68,trunk:0x8a5a3a,wood:0x9b6b45,woodL:0xc49a6c,cream:0xf6eedc,beige:0xe8d8b8};
const TENT_COLORS=[['크림',0xf3ead6],['세이지',0x9cb98a],['테라코타',0xd98a62],['머스터드',0xe2b65e],['하늘',0x95bfd6],['로즈',0xe3a9a6]];
const TENT_TYPES={bell:'벨 텐트',aframe:'A형 텐트',dome:'돔 텐트'};

const matCache={};
function M(color,opt){ const k=color+'|'+JSON.stringify(opt||{}); if(!matCache[k]) matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color,flatShading:true,roughness:.92,metalness:0},opt||{})); return matCache[k]; }
function mesh(geo,color,opt){ const m=new THREE.Mesh(geo,M(color,opt)); m.castShadow=true; m.receiveShadow=true; return m; }
const rnd=(a,b)=>a+Math.random()*(b-a);
let seed=7; const srnd=(a,b)=>{ seed=(seed*16807)%2147483647; return a+(seed/2147483647)*(b-a); };

/* ================= 장면 ================= */
const world=new THREE.Scene();
world.background=new THREE.Color(0xdfe8d6);
world.fog=new THREE.Fog(0xdfe8d6,70,130);
const inside=new THREE.Scene();
inside.background=new THREE.Color(0xe9e1d0);
let scene=world;

function addLights(sc,warm){
  const hemi=new THREE.HemisphereLight(warm?0xfff1dc:0xf4f7ff, warm?0x9b7b5a:0x7f9a6a, warm?1.15:1.25); sc.add(hemi);
  const sun=new THREE.DirectionalLight(warm?0xffe2b8:0xfff3dc, warm?1.6:2.2);
  sun.position.set(warm?6:22,warm?14:34,warm?10:14); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); const s=warm?8:30;
  Object.assign(sun.shadow.camera,{left:-s,right:s,top:s,bottom:-s,near:1,far:120}); sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.03;
  sc.add(sun);
}
addLights(world,false); addLights(inside,true);

/* ===== 카메라: 아이소메트릭 느낌의 직교 카메라 ===== */
const camera=new THREE.OrthographicCamera(-10,10,10,-10,-200,400);
const camDir=new THREE.Vector3(1,1.05,1).normalize();
camera.position.copy(camDir).multiplyScalar(80);
const controls=new OrbitControls(camera,cv);
controls.enableDamping=true; controls.dampingFactor=.12;
controls.minPolarAngle=0.62; controls.maxPolarAngle=1.12;
controls.minAzimuthAngle=Math.PI/4-0.6; controls.maxAzimuthAngle=Math.PI/4+0.6;
controls.minZoom=0.7; controls.maxZoom=3.2; controls.zoomSpeed=1.1;
controls.screenSpacePanning=false;
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
let viewH=26;
function resize(){
  const w=innerWidth,h=innerHeight,a=w/h;
  renderer.setSize(w,h,false);
  const H=Math.max(viewH, (viewH*1.1)/a*0.62);
  camera.left=-H*a/2; camera.right=H*a/2; camera.top=H/2; camera.bottom=-H/2; camera.updateProjectionMatrix();
}
addEventListener('resize',resize);

/* ================= 캠핑장 지형 ================= */
const ISL={w:44,d:34};
function roundRectShape(w,d,r){ const s=new THREE.Shape(), x=-w/2, y=-d/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+d-r); s.quadraticCurveTo(x+w,y+d,x+w-r,y+d);
  s.lineTo(x+r,y+d); s.quadraticCurveTo(x,y+d,x,y+d-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s; }
{
  const soil=mesh(new THREE.ExtrudeGeometry(roundRectShape(ISL.w,ISL.d,4),{depth:3.2,bevelEnabled:false,curveSegments:6}),PAL.soil);
  soil.rotation.x=Math.PI/2; soil.position.y=-0.2; world.add(soil);
  const soilD=mesh(new THREE.ExtrudeGeometry(roundRectShape(ISL.w-1.2,ISL.d-1.2,3.6),{depth:1.6,bevelEnabled:false,curveSegments:6}),PAL.soilD);
  soilD.rotation.x=Math.PI/2; soilD.position.y=-3.3; world.add(soilD);
  const grass=mesh(new THREE.ExtrudeGeometry(roundRectShape(ISL.w+0.3,ISL.d+0.3,4.1),{depth:0.5,bevelEnabled:true,bevelSize:.15,bevelThickness:.15,bevelSegments:1,curveSegments:6}),PAL.grass);
  grass.rotation.x=Math.PI/2; grass.position.y=0.3; world.add(grass);
  // 바닥 그림자 받는 면
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(ISL.w,ISL.d),new THREE.ShadowMaterial({opacity:.18})); ground.rotation.x=-Math.PI/2; ground.position.y=0.46; ground.receiveShadow=true; world.add(ground);
  // 풀 패치
  for(let i=0;i<26;i++){ const p=mesh(new THREE.CircleGeometry(srnd(1.2,3),7),PAL.grass2); p.rotation.x=-Math.PI/2; p.position.set(srnd(-19,19),0.47,srnd(-14,14)); p.castShadow=false; world.add(p); }
}
const Y0=0.47; // 땅 높이

// 호수
const LAKE={x:-14.5,z:9,rx:5.5,rz:4};
{
  const shore=mesh(new THREE.CircleGeometry(1,20),PAL.sand); shore.rotation.x=-Math.PI/2; shore.scale.set(LAKE.rx+1,LAKE.rz+1,1); shore.position.set(LAKE.x,Y0+0.01,LAKE.z); shore.castShadow=false; world.add(shore);
  const water=new THREE.Mesh(new THREE.CircleGeometry(1,24),new THREE.MeshStandardMaterial({color:PAL.water,roughness:.25,metalness:.05,flatShading:true}));
  water.rotation.x=-Math.PI/2; water.scale.set(LAKE.rx,LAKE.rz,1); water.position.set(LAKE.x,Y0+0.03,LAKE.z); water.receiveShadow=true; world.add(water);
  world.userData.water=water;
  // 물결 반짝임
  const glints=new THREE.Group(); for(let i=0;i<9;i++){ const g=new THREE.Mesh(new THREE.PlaneGeometry(rnd(.6,1.4),.08),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7})); g.rotation.x=-Math.PI/2; g.position.set(LAKE.x+rnd(-3.5,3.5),Y0+0.05,LAKE.z+rnd(-2.4,2.4)); g.userData.ph=rnd(0,6); glints.add(g);} world.add(glints); world.userData.glints=glints;
  // 작은 나무 데크
  const deck=new THREE.Group(); for(let i=0;i<5;i++){ const b=mesh(new THREE.BoxGeometry(.5,.14,3),PAL.woodL); b.position.set(i*.55,0,0); deck.add(b);} deck.position.set(LAKE.x+4.2,Y0+0.12,LAKE.z-2.6); deck.rotation.y=-0.7; world.add(deck);
  for(let i=0;i<6;i++){ const r=mesh(new THREE.DodecahedronGeometry(rnd(.3,.6),0),PAL.rock); const a=rnd(0,Math.PI*2); r.position.set(LAKE.x+Math.cos(a)*(LAKE.rx+.6),Y0+.1,LAKE.z+Math.sin(a)*(LAKE.rz+.6)); r.scale.y=.7; world.add(r); }
}

// 뒤쪽 바위산
{
  const g=new THREE.Group();
  [[0,0,0,4.2,6.5],[3.2,0,1.2,3,4.8],[-2.6,0,1.6,2.6,3.6],[1.4,0,-2.4,2.8,4.2]].forEach(([x,y,z,r,h])=>{
    const c=mesh(new THREE.ConeGeometry(r,h,6,1),PAL.rock); c.position.set(x,h/2,z); c.rotation.y=rnd(0,1); g.add(c);
    const c2=mesh(new THREE.ConeGeometry(r*.55,h*.45,5,1),PAL.rockD); c2.position.set(x+r*.3,h*.22,z+r*.4); g.add(c2);
  });
  g.position.set(14.5,Y0,-11.5); world.add(g);
}

/* ===== 12자리 ===== */
const SITES=[]; const CENTER={x:1,z:-0.5}, RX=10.8, RZ=7.6;
for(let i=0;i<12;i++){ const a=-Math.PI/2+i*(Math.PI*2/12)+0.12; SITES.push({no:i+1,x:CENTER.x+Math.cos(a)*RX,z:CENTER.z+Math.sin(a)*RZ}); }

// 가운데 광장 + 큰 모닥불 + 간판
{
  const plaza=mesh(new THREE.CircleGeometry(1,22),PAL.sand); plaza.rotation.x=-Math.PI/2; plaza.scale.set(4.6,3.4,1); plaza.position.set(CENTER.x,Y0+.01,CENTER.z); plaza.castShadow=false; world.add(plaza);
  // 둥근 오솔길 (징검돌)
  for(let k=0;k<64;k++){ const a=k/64*Math.PI*2; const s=mesh(new THREE.CylinderGeometry(.42,.48,.08,7),PAL.stone); s.position.set(CENTER.x+Math.cos(a)*7.1,Y0+.04,CENTER.z+Math.sin(a)*4.9); s.castShadow=false; world.add(s); }
  SITES.forEach(st=>{ for(let k=1;k<=3;k++){ const t=.42+k*.12; const s=mesh(new THREE.CylinderGeometry(.34,.4,.07,7),PAL.stone); s.position.set(CENTER.x+(st.x-CENTER.x)*t,Y0+.035,CENTER.z+(st.z-CENTER.z)*t); s.castShadow=false; world.add(s);} });
  const sign=new THREE.Group(); const p1=mesh(new THREE.BoxGeometry(.18,1.6,.18),PAL.wood); p1.position.set(-1,.8,0); const p2=p1.clone(); p2.position.x=1;
  const board=mesh(new THREE.BoxGeometry(2.6,.9,.14),PAL.woodL); board.position.y=1.45; sign.add(p1,p2,board);
  const tex=textTexture('MY LITTLE CAMP',512,160,'#6b4a2f',58); const face=new THREE.Mesh(new THREE.PlaneGeometry(2.4,.75),new THREE.MeshBasicMaterial({map:tex,transparent:true})); face.position.set(0,1.45,.08); sign.add(face);
  sign.position.set(CENTER.x-1.6,Y0,CENTER.z-2.3); sign.rotation.y=Math.PI/4; world.add(sign);
  const fire=makeProp('campfire'); fire.scale.setScalar(1.6); fire.position.set(CENTER.x+1,Y0,CENTER.z+.6); world.add(fire);
  for(let k=0;k<4;k++){ const a=k/4*Math.PI*2+.4; const log=mesh(new THREE.CylinderGeometry(.32,.32,1.6,7),PAL.wood); log.rotation.z=Math.PI/2; log.rotation.y=a; log.position.set(CENTER.x+1+Math.cos(a)*2.4,Y0+.32,CENTER.z+.6+Math.sin(a)*2.4); world.add(log); }
}

// 나무 흩뿌리기
function pine(h){ const g=new THREE.Group(); const t=mesh(new THREE.CylinderGeometry(.16,.22,h*.3,6),PAL.trunk); t.position.y=h*.15; g.add(t);
  const col=Math.random()<.5?PAL.pine:PAL.pine2;
  for(let i=0;i<3;i++){ const c=mesh(new THREE.ConeGeometry(h*(.36-i*.08),h*.42,7),col); c.position.y=h*(.32+i*.2); g.add(c);} return g; }
function bush(r){ const g=new THREE.Group(); for(let i=0;i<3;i++){ const s=mesh(new THREE.IcosahedronGeometry(r*rnd(.7,1),0),PAL.pine2); s.position.set(rnd(-r,r)*.6,r*.6,rnd(-r,r)*.6); g.add(s);} return g; }
{
  let placed=0, guard=0;
  while(placed<70 && guard++<3000){
    const x=srnd(-20.5,20.5), z=srnd(-15.5,15.5);
    if(Math.abs(x)>ISL.w/2-1.2||Math.abs(z)>ISL.d/2-1.2) continue;
    if(SITES.some(s=>Math.hypot(s.x-x,s.z-z)<4.2)) continue;
    if(((x-LAKE.x)/(LAKE.rx+1.6))**2+((z-LAKE.z)/(LAKE.rz+1.6))**2<1) continue;

  if(bg){ x.fillStyle=bg; x.beginPath(); x.arc(w/2,h/2,Math.min(w,h)/2-4,0,Math.PI*2); x.fill(); }
  x.fillStyle=color; x.font=`800 ${size}px Jua,sans-serif`; x.textAlign='center'; x.textBaseline='middle'; x.fillText(txt,w/2,h/2+2);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t; }

  else if(myLoc) setCard(`<div class="hint">놀러 온 캠핑장이에요<small>내 텐트는 ${myLoc.camp}번 캠핑장 ${myLoc.site}번 자리에 있어요</small></div><div class="row" style="margin-top:10px"><button class="btn" id="goHome">내 캠핑장으로</button></div>${campNav()}`);
  else setCard(`<div class="hint">${full?'이 캠핑장은 꽉 찼어요 · 옆 캠핑장(›)으로 가 보세요':'빈자리(＋)를 눌러 내 텐트를 쳐 보세요'}<small>손가락으로 돌려 보고, 두 손가락으로 확대할 수 있어요</small></div>${campNav()}`);
  setTimeout(()=>{ const b=$('goMine'); if(b) b.onclick=()=>enterOutside(me.site);
    const h=$('goHome'); if(h) h.onclick=()=>switchCamp(myLoc.camp);
    const sh=$('share'); if(sh) sh.onclick=shareCamp;
    const p=$('cPrev'), n=$('cNext'); if(p) p.onclick=()=>switchCamp(campNo-1); if(n) n.onclick=()=>switchCamp(campNo+1); },140);
}
async function shareCamp(){ const url=`${location.origin}/camp/?c=${campNo}${me?`&s=${me.site}`:''}`; track('share','camp');
  try{ if(navigator.share){ await navigator.share({title:'MY LITTLE CAMP',text:'내 텐트 구경 와 ⛺',url}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(url); toast('링크를 복사했어요'); }catch(e){ prompt('링크를 복사해 주세요',url); } }
let pick={type:'bell',color:TENT_COLORS[0][1]};
function showPlaceCard(no){
  curSite=no; if(!pick.name&&user&&user.user_metadata){ const nm=user.user_metadata.name||user.user_metadata.full_name; if(nm) pick.name=String(nm).slice(0,10); }
  setCard(`<h3>${no}번 자리에 텐트 치기</h3><p class="sub">텐트 종류와 색을 골라 주세요</p>
  <div class="types">${Object.entries(TENT_TYPES).map(([k,v])=>`<button class="type${k===pick.type?' sel':''}" data-t="${k}">${tentIcon[k]}${v}<small>${k==='bell'?'넓고 아늑해요':k==='aframe'?'클래식 삼각':'동글동글'}</small></button>`).join('')}</div>
  <div class="swatches">${TENT_COLORS.map(([n,c])=>`<button class="sw${c===pick.color?' sel':''}" data-c="${c}" title="${n}" style="background:#${c.toString(16).padStart(6,'0')}"></button>`).join('')}</div>
  ${me||myLoc?'':`<input class="field" id="nick" maxlength="10" placeholder="캠핑장에서 쓸 이름 (10자까지)" value="${(pick.name||'').replace(/"/g,'')}">`}
  <div class="row"><button class="btn ghost" id="cancel">취소</button><button class="btn" id="pitch">⛺ ${me&&me.site===no?'바꾸기':'텐트 치기'}</button></div>
  ${me&&me.site===no?'<div class="row"><button class="link" id="leave">텐트 걷기 (자리 비우기)</button></div>':''}`);
  { const st=SITES.find(s=>s.no===no); focus(st.x,st.z,innerWidth<700?1.7:1.6,330); }
  setTimeout(()=>{
    card.querySelectorAll('.type').forEach(b=>b.onclick=()=>{ pick.type=b.dataset.t; card.querySelectorAll('.type').forEach(x=>x.classList.toggle('sel',x===b)); preview(); });
    card.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{ pick.color=+b.dataset.c; card.querySelectorAll('.sw').forEach(x=>x.classList.toggle('sel',x===b)); preview(); });
    $('cancel').onclick=()=>{ clearPreview(); showWorldCard(); focusWorld(); };
    const nk=$('nick'); if(nk) nk.oninput=()=>{ pick.name=nk.value; };
    const lv=$('leave'); if(lv) lv.onclick=async()=>{ if(!confirm('텐트를 걷으면 꾸민 소품도 모두 사라져요. 걷을까요?')) return; clearPreview(); const {error}=await sb.rpc('camp_leave'); if(error){ toast(errMsg(error)); return; } await loadCamp(campNo); buildAll(); focusWorld(); showWorldCard(); toast('텐트를 걷었어요'); };
    $('pitch').onclick=async()=>{
      if(!user){ clearPreview(); loginCard({camp:campNo,site:no,type:pick.type,color:pick.color}); return; }
      const name=me?me.name:((pick.name||'').trim()||(myLoc&&myLoc.name)||''); if(!name){ toast('캠핑장에서 쓸 이름을 적어 주세요'); nk&&nk.focus(); return; }
      const btn=$('pitch'); btn.disabled=true; await saving;
      const moving=myLoc&&!(myLoc.camp===campNo&&myLoc.site===no);
      if(moving&&!confirm(`지금 텐트(${myLoc.camp}번 캠핑장 ${myLoc.site}번)를 이 자리로 옮길까요? 꾸민 소품은 그대로 따라와요`)){ btn.disabled=false; return; }
      const {error}=await sb.rpc('camp_pick',{p_camp:campNo,p_site:no,p_type:pick.type,p_color:pick.color,p_name:name});
      btn.disabled=false;
      if(error){ toast(errMsg(error)); clearPreview(); await loadCamp(campNo); buildAll(); focusWorld(); showWorldCard(); return; }
      clearPreview(); const isNew=!myLoc; await loadCamp(campNo); buildAll(); if(isNew) track('create','camp');
      toast(`${no}번 자리에 ${TENT_TYPES[pick.type]}를 쳤어요!`); enterOutside(no); };
    preview();
  },140);
}
let ghost=null;
function preview(){ clearPreview(); const s=SITES[curSite-1]; ghost=makeTent(pick.type,pick.color); ghost.position.set(s.x,Y0+.1,s.z); ghost.rotation.y=Math.PI/4; ghost.traverse(o=>{ if(o.material){ o.material=o.material.clone(); o.material.transparent=true; o.material.opacity=.8; } }); world.add(ghost); }
function clearPreview(){ if(ghost){ world.remove(ghost); ghost=null; } }

function enterOutside(no){
  mode='outside'; curSite=no; scene=world; const s=SITES[no-1]; focus(s.x,s.z,innerWidth<700?2.05:2.2);
  setCard(`<h3>${no}번 자리 · 바깥 꾸미기</h3><p class="sub">소품을 누르면 텐트 앞에 놓여요. 끌어서 옮겨 보세요</p>
  <div class="palette">${OUT_ITEMS.map(([k,n,e])=>`<button class="pi" data-k="${k}"><span>${e}</span>${n}</button>`).join('')}</div>
  <div class="row"><button class="btn ghost" id="toWorld">캠핑장 보기</button><button class="btn ghost" id="retent">텐트 바꾸기</button><button class="btn wood" id="goIn">텐트 안으로</button></div>`);
  setTimeout(()=>{
    card.querySelectorAll('.pi').forEach(b=>b.onclick=()=>addItem(b.dataset.k));
    $('toWorld').onclick=()=>{ select(null); focusWorld(); showWorldCard(); };
    $('retent').onclick=()=>{ select(null); pick={type:me.type,color:me.color}; showPlaceCard(no); };
    $('goIn').onclick=()=>{ select(null); enterInside(me,true); };
  },140);
}
function enterInside(data,editable){
  mode=editable?'inside':'visitIn'; scene=inside; buildInside(data,editable); focusInside();
  if(editable) setCard(`<h3>텐트 안 꾸미기</h3><p class="sub">앞벽을 걷어 낸 단면이에요. 소품을 눌러 놓고 끌어서 옮겨요</p>
    <div class="palette">${IN_ITEMS.map(([k,n,e])=>`<button class="pi" data-k="${k}"><span>${e}</span>${n}</button>`).join('')}</div>
    <div class="row"><button class="btn ghost" id="goOut">밖으로 나가기</button></div>`);
  else setCard(`<h3>${data.name}님의 텐트 안</h3><p class="sub">구경 중이에요. 마음에 들면 내 텐트도 꾸며 보세요</p><div class="row"><button class="btn ghost" id="goOut">밖으로 나가기</button></div>`);
  setTimeout(()=>{ card.querySelectorAll('.pi').forEach(b=>b.onclick=()=>addItem(b.dataset.k)); $('goOut').onclick=()=>{ select(null); scene=world; if(editable) enterOutside(curSite); else { visitOutside(visitData); } }; },140);
}
function visitOutside(no){
  mode='visit'; visitData=no; const d=NEIGHBORS[no], s=SITES[no-1]; focus(s.x,s.z,2.1);
  setCard(`<h3>${d.name}님의 텐트 <span style="color:var(--dim);font-weight:600;font-size:13px">· ${no}번</span></h3><p class="sub">${TENT_TYPES[d.type]} · 놀러 왔어요</p>
  <div class="row"><button class="btn ghost" id="back">캠핑장 보기</button><button class="btn wood" id="peek">텐트 안 구경하기</button></div>`);
  setTimeout(()=>{ $('back').onclick=()=>{ focusWorld(); showWorldCard(); }; $('peek').onclick=()=>{ enterInside(d,false); }; },140);
}

/* ================= 소품 놓기·끌기 ================= */
let selected=null;
function editGroup(){ return mode==='outside'?siteObjs[curSite].outGroup : mode==='inside'?inItems : null; }
function areaInfo(){ if(mode==='outside') return {R:2.75,core:1.95}; return {R:3.6,core:0}; }
function addItem(k){
  const g=editGroup(); if(!g) return; const p=makeProp(k); p.userData.item=true;
  if(mode==='outside'){ const a=Math.PI/4+rnd(-.9,.9); p.position.set(Math.sin(a)*2.35,.1,Math.cos(a)*2.35); }
  else { p.position.set(rnd(-1.2,1.6),.08,rnd(-.2,1.8)); }
  p.rotation.y=rnd(-.5,.5); g.add(p); pop(p); persist(); select(p); setTimeout(()=>ensureVisible(p),60);
}
function pop(o){ o.scale.setScalar(.01); o.userData.grow=0; }
function persist(){ if(!me) return; const pack=g=>g.children.map(o=>[o.userData.type,+o.position.x.toFixed(2),+o.position.z.toFixed(2),+o.rotation.y.toFixed(2)]);
  if(mode==='outside') me.out=pack(siteObjs[curSite].outGroup); if(mode==='inside') me.in=pack(inItems); save(); }
const ITEM_NAME=Object.fromEntries([...OUT_ITEMS,...IN_ITEMS].map(([k,n,e])=>[k,e+' '+n]));
const marker=new THREE.Group();
{ const ring=new THREE.Mesh(new THREE.RingGeometry(.48,.62,40),new THREE.MeshBasicMaterial({color:0xffd75e,transparent:true,opacity:.95,depthWrite:false,depthTest:false}));
  ring.rotation.x=-Math.PI/2; ring.position.y=.03; ring.renderOrder=1; marker.add(ring); marker.userData.ring=ring;
  const arrow=new THREE.Mesh(new THREE.ConeGeometry(.17,.32,4),new THREE.MeshBasicMaterial({color:0xffb52e,depthTest:false}));
  arrow.renderOrder=20; arrow.rotation.x=Math.PI; marker.add(arrow); marker.userData.arrow=arrow; marker.userData.noPick=true; }
function attachMarker(o){
  if(marker.parent) marker.parent.remove(marker);
  const sc=o.scale.x, ry=o.rotation.y; o.scale.setScalar(1); o.rotation.y=0; o.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(o), sz=new THREE.Vector3(); box.getSize(sz);
  const top=box.max.y-o.getWorldPosition(new THREE.Vector3()).y;
  o.scale.setScalar(sc); o.rotation.y=ry; o.updateMatrixWorld(true);
  const r=Math.min(1.2,Math.max(.35,Math.max(sz.x,sz.z)*.6));
  marker.userData.ring.scale.setScalar(r/.55); marker.userData.top=top+.3; marker.userData.arrow.position.y=top+.3;
  o.add(marker); }
function select(o){ if(selected) setHighlight(selected,false); marker.parent&&marker.parent.remove(marker); selected=o;
  if(o){ setHighlight(o,true); attachMarker(o); $('tName').textContent=ITEM_NAME[o.userData.type]||'소품'; $('tool').classList.add('show'); placeTool(); } else hideTool(); }
function hideTool(){ $('tool').classList.remove('show'); }
function placeTool(){ $('tool').style.bottom=(card.getBoundingClientRect().height+22)+'px'; }
function setHighlight(o,on){ o.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive){ if(on){ m.userData.orig=m.userData.orig||{e:m.material.emissive.getHex(),i:m.material.emissiveIntensity,mat:m.material}; m.material=m.material.clone(); m.material.emissive.setHex(0xffc94a); m.material.emissiveIntensity=.45; } else if(m.userData.orig){ m.material=m.userData.orig.mat; delete m.userData.orig; } } }); }
$('tRot').onclick=()=>{ if(selected){ selected.rotation.y+=Math.PI/4; persist(); } };
$('tDel').onclick=()=>{ if(selected){ selected.parent.remove(selected); selected=null; hideTool(); persist(); toast('치웠어요'); } };
$('tOk').onclick=()=>select(null);

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let down=null, dragging=null;
function setNdc(e){ const r=cv.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(ndc,camera); }
function itemUnder(e){ const g=editGroup(); if(!g) return null; setNdc(e); const hits=ray.intersectObjects(g.children,true); if(!hits.length) return null; let o=hits[0].object; while(o.parent&&o.parent!==g) o=o.parent; return o; }
function groundPoint(e,y){ setNdc(e); const p=new THREE.Vector3(); return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-y),p)?p:null; }
cv.addEventListener('pointerdown',e=>{
  down={x:e.clientX,y:e.clientY,t:performance.now()};
  const it=itemUnder(e);
  if(it){ dragging=it; select(it); controls.enabled=false; try{ cv.setPointerCapture(e.pointerId); }catch(_){} }
});
cv.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const g=editGroup(); const root=mode==='outside'?siteObjs[curSite].root:inRoot;
  const y=mode==='outside'?Y0+.1:.08; const p=groundPoint(e,y); if(!p) return;
  const local=root.worldToLocal(p.clone()); const {R,core}=areaInfo();
  let len=Math.hypot(local.x,local.z); if(len>R){ local.x*=R/len; local.z*=R/len; len=R; }
  if(core && len<core){ const k=core/Math.max(len,.001); local.x*=k; local.z*=k; }
  dragging.position.x=local.x; dragging.position.z=local.z;
});
cv.addEventListener('pointerup',e=>{
  const moved=down?Math.hypot(e.clientX-down.x,e.clientY-down.y):99;
  if(dragging){ dragging=null; controls.enabled=true; persist(); return; }
  if(moved<7 && down && performance.now()-down.t<600) tap(e);
  down=null;
});
function tap(e){
  if(mode==='inside'||mode==='visitIn'){ select(null); return; }
  if(mode==='outside' && selected){ select(null); }
  setNdc(e); const hits=ray.intersectObjects(hitMeshes,false); if(!hits.length) return;
  const no=hits[0].object.userData.site;
  if(me && me.site===no){ if(mode!=='outside') enterOutside(no); return; }
  if(NEIGHBORS[no]){ select(null); visitOutside(no); return; }
  if(mode==='outside' && me) { toast('한 계정에 텐트는 한 자리예요'); }
  focus(SITES[no-1].x,SITES[no-1].z,1.9); showPlaceCard(no);
}

/* ================= 카메라 이동 ================= */
let tween=null;
// 하단 카드·상단 바에 가리지 않는 '보이는 영역' 가운데로 (x,z)를 데려오는 목표점
function bandTarget(x,y,z,zoom,sheetH){
  const top=64, bottom=innerHeight-sheetH, yDes=(top+bottom)/2, dpx=yDes-innerHeight/2;
  const upp=(camera.top-camera.bottom)/zoom/innerHeight;
  camera.updateMatrixWorld(); const up=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
  const T=new THREE.Vector3(x,y,z).addScaledVector(up,dpx*upp);
  const d=new THREE.Vector3(); camera.getWorldDirection(d); const k=(y-T.y)/d.y; return T.addScaledVector(d,k);
}
function sheetGuess(){ return Math.min(innerHeight*.5, 300); }
function focus(x,z,zoom,sheetH){ const to=bandTarget(x,Y0+.6,z,zoom,sheetH==null?sheetGuess():sheetH); tween={from:controls.target.clone(),to,z0:camera.zoom,z1:zoom,t:0}; }
function ensureVisible(o){
  const p=o.getWorldPosition(new THREE.Vector3()); const v=p.clone().project(camera); const sy=(1-v.y)/2*innerHeight, sx=(v.x+1)/2*innerWidth;
  const r=card.getBoundingClientRect(); const limit=Math.min(r.top,innerHeight)-80;
  if(sy>limit||sy<90||sx<30||sx>innerWidth-30){ const to=bandTarget(p.x,p.y,p.z,camera.zoom,innerHeight-r.top+70); tween={from:controls.target.clone(),to,z0:camera.zoom,z1:camera.zoom,t:0}; }
}
function focusWorld(){ tween={from:controls.target.clone(),to:new THREE.Vector3(CENTER.x,0,CENTER.z),z0:camera.zoom,z1:1,t:0}; }
function focusInside(){ controls.target.set(0,.8,0); camera.position.copy(camDir).multiplyScalar(60); camera.zoom=innerWidth<700?2.25:2.4; camera.updateProjectionMatrix(); controls.update(); const T=bandTarget(0,.3,.4,camera.zoom,sheetGuess()); camera.position.add(T.clone().sub(controls.target)); controls.target.copy(T); tween=null; }

/* ================= 그리기 ================= */
const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(.05,clock.getDelta()), t=clock.elapsedTime;
  if(tween){ tween.t=Math.min(1,tween.t+dt*1.8); const k=1-Math.pow(1-tween.t,3); const prev=controls.target.clone(); controls.target.lerpVectors(tween.from,tween.to,k); camera.position.add(controls.target.clone().sub(prev)); camera.zoom=tween.z0+(tween.z1-tween.z0)*k; camera.updateProjectionMatrix(); if(tween.t>=1) tween=null; }
  if(scene===world){ const tg=controls.target; tg.x=Math.max(-16,Math.min(16,tg.x)); tg.z=Math.max(-12,Math.min(12,tg.z)); }
  if(marker.parent){ marker.userData.arrow.position.y=marker.userData.top+Math.sin(t*5)*.12; marker.userData.arrow.rotation.y=t*2; marker.userData.ring.material.opacity=.65+.3*Math.sin(t*5); }
  fires.forEach((f,i)=>{ f.scale.y=1+Math.sin(t*12+i)*.12; f.scale.x=f.scale.z=1+Math.cos(t*9+i)*.06; });
  Object.values(siteObjs).forEach(s=>{ const p=s.root.userData.pulse; if(p){ const k=1+Math.sin(t*3)*.08; p[0].scale.set(k,k,k); p[1].position.y=.9+Math.sin(t*3)*.12; } });
  const gl=world.userData.glints; if(gl) gl.children.forEach(g=>g.material.opacity=.25+.5*Math.max(0,Math.sin(t*1.6+g.userData.ph)));
  [world,inside].forEach(sc=>sc.traverse(o=>{ if(o.userData.grow!==undefined){ o.userData.grow=Math.min(1,o.userData.grow+dt*4); const k=o.userData.grow; o.scale.setScalar(k<1?(1.15*Math.sin(k*Math.PI/2)):1); if(k>=1) delete o.userData.grow; } }));
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop);
}

/* ================= 시작 ================= */
resize(); controls.target.set(CENTER.x,0,CENTER.z); camera.zoom=1; camera.updateProjectionMatrix();
loop();
(async()=>{
  const q=new URLSearchParams(location.search); const qc=parseInt(q.get('c'))||null, qs=parseInt(q.get('s'))||null;
  const {data}=await sb.auth.getSession(); user=data.session?data.session.user:null;
  if(location.hash.includes('access_token')) history.replaceState(null,'',location.pathname+location.search);
  sb.auth.onAuthStateChange((ev,ss)=>{ user=ss?ss.user:null; });
  let after=null; try{ after=JSON.parse(sessionStorage.getItem('mlc-after')||'null'); sessionStorage.removeItem('mlc-after'); }catch(e){}
  await loadCamp(after&&user?after.camp:qc); buildAll();
  if(after&&user&&!isTaken(after.site)){ pick.type=after.type; pick.color=after.color;
    const nm=user.user_metadata&&(user.user_metadata.name||user.user_metadata.full_name); if(!pick.name&&nm) pick.name=String(nm).slice(0,10);
    showPlaceCard(after.site); return; }
  if(qs&&NEIGHBORS[qs]){ showWorldCard(); setTimeout(()=>visitOutside(qs),300); return; }
  showWorldCard();
})();
setTimeout(()=>$('loading').classList.add('hide'),200);
window.__camp={marker,get selected(){return selected},get mode(){return mode},get me(){return me},SITES,enterOutside,addItem,enterInside,showPlaceCard,camera,controls,visitOutside};
</script>
