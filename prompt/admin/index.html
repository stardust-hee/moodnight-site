<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MOODNIGHT · 프롬프트 관리</title>
<link rel="stylesheet" href="/prompt/assets/style.css">
</head>
<body>

<!-- 로그인 -->
<div id="loginView" class="login" hidden>
  <h1>MOODNIGHT ADMIN</h1>
  <p style="font-size:14px;color:var(--sub);margin-bottom:16px">관리자 로그인이 필요해요.<br>로그인한 뒤 이 페이지로 다시 와 주세요.</p>
  <a href="/admin/" style="display:block;padding:13px;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:600;text-decoration:none">관리자 로그인하러 가기</a>
  <div class="err" id="loginErr"></div>
</div>

<!-- 관리 화면 -->
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="side-top"><b>PROMPTS</b><button id="newBtn" type="button">+ 새 글</button></div>
    <div class="list" id="list"></div>
    <div class="side-foot"><span id="who"></span><button id="logoutBtn" type="button">로그아웃</button></div>
  </aside>

  <section class="main" id="main">
    <div class="empty" id="emptyMain">왼쪽에서 글을 고르거나 새 글을 만들어 주세요</div>

    <div id="editWrap" style="display:none;flex-direction:column;min-height:0;flex:1">
      <div class="bar">
        <button class="back" id="backBtn" type="button" aria-label="목록">‹</button>
        <span class="status" id="status"></span>
        <button class="pill" id="pubBtn" type="button">비공개</button>
        <button class="pill dark" id="linkBtn" type="button">링크 복사</button>
        <button class="pill" id="openBtn" type="button">열어보기</button>
        <button class="pill" id="dupBtn" type="button">복제</button>
        <button class="pill danger" id="delBtn" type="button">삭제</button>
      </div>
      <div class="page" id="page">
        <div class="page-inner">
          <input class="ghost g-label" id="fLabel" placeholder="라벨 (예: AI PROMPT 001)">
          <textarea class="ghost g-title" id="fTitle" rows="1" placeholder="제목을 입력하세요"></textarea>
          <textarea class="ghost g-sub" id="fSub" rows="1" placeholder="한 줄 소개를 입력하세요"></textarea>
          <div class="rule"></div>
          <div class="doc" id="blocks"></div>
          <div class="addrow">
            <button type="button" id="addText">+ 글 추가</button>
            <button type="button" id="addCode">+ 프롬프트 상자 추가</button>
          </div>
          <div class="linkrow"><span id="linkText"></span></div>
          <p class="hint">공개 페이지와 똑같은 모습이에요. 글을 누르면 그 자리에서 바로 고칠 수 있고, 입력하면 자동 저장돼요.</p>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/prompt/assets/common.js"></script>
<script>
(function () {
  var sb = MN.sb();
  var $ = function (id) { return document.getElementById(id); };
  var items = [], cur = null, timer = null, saving = null;

  /* ---------- auth ---------- */
  function showLogin(err) { $('app').hidden = true; $('loginView').hidden = false; $('loginErr').textContent = err || ''; }

  async function enter(session) {
    var r = await sb.rpc('is_admin');
    if (r.error || r.data !== true) {
      await sb.auth.signOut();
      showLogin('관리자 계정이 아니에요. /admin/에서 관리자 계정으로 로그인해 주세요.');
      return;
    }
    $('who').textContent = (session.user.email || '').split('@')[0];
    $('loginView').hidden = true; $('app').hidden = false;
    await loadList();
  }

  $('logoutBtn').onclick = async function () { await flush(); await sb.auth.signOut(); location.href = '/admin/'; };

  /* ---------- list ---------- */
  function fmt(d) { var x = new Date(d); return (x.getMonth() + 1) + '/' + x.getDate(); }

  function renderList() {
    $('list').innerHTML = items.length ? items.map(function (p) {
      return '<button class="item' + (cur && cur.id === p.id ? ' active' : '') + '" data-id="' + p.id + '">' +
        '<span class="t">' + MN.esc(p.title || '제목 없음') + '</span>' +
        '<span class="m"><span class="dot' + (p.published ? ' on' : '') + '"></span>' +
        (p.published ? '공개' : '비공개') + ' · 👁 ' + p.view_count + ' · ' + fmt(p.updated_at) + '</span></button>';
    }).join('') : '<div class="hint" style="padding:14px">아직 글이 없어요.</div>';
  }

  async function loadList() {
    var r = await sb.from('prompts').select('id,slug,label,title,published,view_count,updated_at').order('created_at', { ascending: false });
    items = r.data || [];
    renderList();
  }

  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('.item'); if (b) openItem(b.dataset.id);
  });

  /* ---------- editor (WYSIWYG blocks) ---------- */
  var blocks = [], editIdx = -1;

  function grow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
  function setStatus(t) { $('status').textContent = t; }

  function parseBlocks(src) {
    var lines = String(src || '').replace(/\r\n?/g, '\n').split('\n'), out = [], buf = [], i = 0;
    function flushText() {
      while (buf.length && buf[0].trim() === '') buf.shift();
      while (buf.length && buf[buf.length - 1].trim() === '') buf.pop();
      if (buf.length) out.push({ type: 'text', text: buf.join('\n') });
      buf = [];
    }
    while (i < lines.length) {
      var l = lines[i];
      if (/^```/.test(l)) {
        flushText(); var c = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) { c.push(lines[i]); i++; }
        i++; out.push({ type: 'code', text: c.join('\n') }); continue;
      }
      if (/^\s*$/.test(l)) { flushText(); i++; continue; }
      buf.push(l); i++;
    }
    flushText();
    return out;
  }

  function serialize() {
    return blocks.filter(function (b) { return b.text.trim() !== ''; }).map(function (b) {
      return b.type === 'code' ? '```\n' + b.text + '\n```' : b.text;
    }).join('\n\n');
  }

  function blockHtml(b) { return MN.md(b.type === 'code' ? '```\n' + b.text + '\n```' : b.text); }

  function renderBlocks() {
    var host = $('blocks');
    if (!blocks.length) {
      host.innerHTML = '<div class="blk-v empty-blk" data-i="-1">여기를 눌러 글을 써보세요</div>';
      return;
    }
    host.innerHTML = blocks.map(function (b, i) {
      if (i === editIdx) {
        var code = b.type === 'code';
        return '<div class="blk-e" data-i="' + i + '">' +
          '<div class="blk-tag">' + (code ? '프롬프트 상자 · 보는 사람에게 복사 버튼이 달려요' : '글') + '</div>' +
          '<textarea class="box' + (code ? ' mono' : '') + '" data-i="' + i + '" rows="3" placeholder="' + (code ? '프롬프트를 붙여넣으세요' : '내용을 입력하세요') + '">\n' + MN.esc(b.text) + '</textarea>' +
          '<div class="blk-tools"><button type="button" data-a="up">↑</button><button type="button" data-a="down">↓</button>' +
          '<button type="button" class="danger" data-a="del">삭제</button><button type="button" class="primary" data-a="done">완료</button></div>' +
          (code ? '' : '<div class="blk-hint">## 소제목 · 1. 번호 단계 · - 목록 · &gt; 안내 박스 · --- 구분선 · **굵게**</div>') + '</div>';
      }
      return '<div class="blk-v" data-i="' + i + '">' + blockHtml(b) + '</div>';
    }).join('');
    if (editIdx >= 0) {
      var ta = host.querySelector('textarea');
      if (ta) { grow(ta); ta.focus(); try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {} ta.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    }
  }

  function setEdit(j) {
    if (editIdx >= 0 && editIdx !== j && blocks[editIdx] && blocks[editIdx].text.trim() === '') {
      blocks.splice(editIdx, 1); if (j > editIdx) j--; sync();
    }
    editIdx = j; renderBlocks();
  }

  function addBlock(type) {
    var at = editIdx >= 0 ? editIdx + 1 : blocks.length;
    if (editIdx >= 0 && blocks[editIdx].text.trim() === '') { blocks.splice(editIdx, 1); at = editIdx; }
    blocks.splice(at, 0, { type: type, text: '' });
    editIdx = at; renderBlocks();
  }

  function paintBar() {
    var on = !!cur.published;
    $('pubBtn').textContent = on ? '공개 중' : '비공개';
    $('pubBtn').classList.toggle('on', on);
    $('linkText').textContent = MN.shareUrl(cur.slug) + (on ? '' : '  (비공개 — 공개로 바꿔야 열려요)');
  }

  async function openItem(id) {
    await flush();
    var r = await sb.from('prompts').select('*').eq('id', id).single();
    if (r.error) { MN.toast('불러오지 못했어요'); return; }
    cur = r.data;
    $('emptyMain').style.display = 'none'; $('editWrap').style.display = 'flex';
    $('fLabel').value = cur.label; $('fTitle').value = cur.title; $('fSub').value = cur.subtitle;
    grow($('fTitle')); grow($('fSub'));
    blocks = parseBlocks(cur.body); editIdx = -1; renderBlocks();
    paintBar(); setStatus('');
    $('page').scrollTop = 0;
    $('app').classList.add('editing');
    renderList();
  }

  function schedule() {
    setStatus('수정 중…');
    clearTimeout(timer);
    timer = setTimeout(save, 1000);
  }
  function sync() { if (cur) schedule(); }

  async function save() {
    clearTimeout(timer); timer = null;
    if (!cur) return;
    var id = cur.id;
    var patch = { label: $('fLabel').value, title: $('fTitle').value.trim() || '제목 없음', subtitle: $('fSub').value, body: serialize() };
    setStatus('저장 중…');
    saving = sb.from('prompts').update(patch).eq('id', id).select('updated_at').single();
    var r = await saving; saving = null;
    if (r.error) { setStatus('저장 실패 — 다시 시도 중이에요'); timer = setTimeout(save, 3000); return; }
    Object.assign(cur, patch);
    var it = items.find(function (x) { return x.id === id; });
    if (it) { it.title = patch.title; it.label = patch.label; it.updated_at = r.data.updated_at; }
    renderList();
    if (cur && cur.id === id) setStatus('저장됨 ✓');
  }

  async function flush() { if (timer) await save(); if (saving) await saving; }

  ['fLabel', 'fTitle', 'fSub'].forEach(function (id) {
    $(id).addEventListener('input', function () {
      if (id !== 'fLabel') grow($(id));
      schedule();
    });
  });
  /* Enter in title/subtitle jumps on instead of adding a line break */
  $('fLabel').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('fTitle').focus(); } });
  $('fTitle').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('fSub').focus(); } });
  $('fSub').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); if (!blocks.length) addBlock('text'); else setEdit(0); } });

  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(); }
  });
  window.addEventListener('beforeunload', function (e) { if (timer) { e.preventDefault(); e.returnValue = ''; } });

  var host = $('blocks');
  MN.bindCopy(host);

  host.addEventListener('input', function (e) {
    var ta = e.target.closest('textarea'); if (!ta) return;
    var i = +ta.dataset.i;
    if (blocks[i]) { blocks[i].text = ta.value; grow(ta); sync(); }
  });

  host.addEventListener('keydown', function (e) {
    if (e.key === 'Tab' && e.target.tagName === 'TEXTAREA') {
      e.preventDefault();
      var t = e.target, s0 = t.selectionStart;
      t.value = t.value.slice(0, s0) + '  ' + t.value.slice(t.selectionEnd);
      t.selectionStart = t.selectionEnd = s0 + 2;
      t.dispatchEvent(new Event('input', { bubbles: true }));
    }
  });

  host.addEventListener('click', function (e) {
    if (e.target.closest('.copy-btn')) return;
    if (e.target.closest('a')) e.preventDefault();

    var btn = e.target.closest('button[data-a]');
    if (btn) {
      var i = editIdx, act = btn.dataset.a;
      if (act === 'done') { setEdit(-1); }
      else if (act === 'del') { blocks.splice(i, 1); editIdx = -1; sync(); renderBlocks(); }
      else if (act === 'up' && i > 0) { var t1 = blocks[i]; blocks[i] = blocks[i - 1]; blocks[i - 1] = t1; editIdx = i - 1; sync(); renderBlocks(); }
      else if (act === 'down' && i < blocks.length - 1) { var t2 = blocks[i]; blocks[i] = blocks[i + 1]; blocks[i + 1] = t2; editIdx = i + 1; sync(); renderBlocks(); }
      return;
    }
    if (e.target.closest('.blk-e')) return;
    var v = e.target.closest('.blk-v');
    if (!v) return;
    var j = +v.dataset.i;
    if (j === -1) { blocks.push({ type: 'text', text: '' }); editIdx = 0; renderBlocks(); return; }
    setEdit(j);
  });

  $('addText').onclick = function () { addBlock('text'); };
  $('addCode').onclick = function () { addBlock('code'); };

  /* ---------- actions ---------- */
  var TEMPLATE = '## 사용 방법\n\n1. ChatGPT에 사진 한 장을 첨부하세요.\n2. 아래 프롬프트 전체를 복사하여 입력하세요.\n3. 이미지 생성을 요청하세요.\n\n## 무료 이미지 생성 프롬프트\n\n```\n여기에 프롬프트를 붙여넣으세요\n```\n\n※ 원본 사진 및 이미지 생성 모델에 따라 결과가 달라질 수 있습니다.\n\n---\n\n더 많은 AI 콘텐츠는 @moodnight.official에서 만나보세요.';

  async function create(base) {
    await flush();
    var n = String(items.length + 1); while (n.length < 3) n = '0' + n;
    var row = base || { label: 'AI PROMPT ' + n, title: '제목 없음', subtitle: '', body: TEMPLATE };
    var r = await sb.from('prompts').insert(row).select('id').single();
    if (r.error) { MN.toast('만들지 못했어요'); return; }
    await loadList();
    openItem(r.data.id);
  }

  $('newBtn').onclick = function () { create(); };

  $('dupBtn').onclick = async function () {
    if (!cur) return;
    await flush(); create({ label: cur.label, title: cur.title + ' (복사본)', subtitle: cur.subtitle, body: cur.body, published: false });
  };

  $('pubBtn').onclick = async function () {
    if (!cur) return;
    await flush();
    var next = !cur.published;
    var r = await sb.from('prompts').update({ published: next }).eq('id', cur.id);
    if (r.error) { MN.toast('바꾸지 못했어요'); return; }
    cur.published = next;
    var it = items.find(function (x) { return x.id === cur.id; }); if (it) it.published = next;
    paintBar(); renderList();
    MN.toast(next ? '공개로 바꿨어요. 링크로 열 수 있어요' : '비공개로 바꿨어요. 링크가 닫혔어요');
  };

  $('linkBtn').onclick = function () {
    if (!cur) return;
    MN.copyText(MN.shareUrl(cur.slug)).then(function (ok) {
      MN.toast(ok ? (cur.published ? '링크 복사됐어요 ✓' : '복사했어요 (아직 비공개라 열리지 않아요)') : '복사에 실패했어요');
    });
  };

  $('openBtn').onclick = function () { if (cur) window.open(MN.shareUrl(cur.slug), '_blank', 'noopener'); };

  $('delBtn').onclick = async function () {
    if (!cur) return;
    if (!confirm('「' + cur.title + '」을 삭제할까요? 되돌릴 수 없고, 보낸 링크도 모두 닫혀요.')) return;
    clearTimeout(timer); timer = null;
    var r = await sb.from('prompts').delete().eq('id', cur.id);
    if (r.error) { MN.toast('삭제하지 못했어요'); return; }
    cur = null;
    $('editWrap').style.display = 'none'; $('emptyMain').style.display = 'flex';
    $('app').classList.remove('editing');
    await loadList();
  };

  $('backBtn').onclick = async function () { await flush(); $('app').classList.remove('editing'); };

  /* ---------- boot ---------- */
  sb.auth.getSession().then(function (r) {
    if (r.data.session) enter(r.data.session); else showLogin();
  });
})();
</script>
</body>
</html>
